<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer ⏱️</title>

    <!-- Dynamic Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      id="favicon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>"
    />

    <!-- jsPDF & html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
      /* Google Fonts */
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Male Theme */
        --male-bg-1: #1a1a2e;
        --male-bg-2: #16213e;
        --male-accent-1: #0f3460;
        --male-accent-2: #533483;
        --male-highlight: #e94560;
        --male-text: #eee;
        --male-glass: rgba(255, 255, 255, 0.08);

        /* Female Theme */
        --female-bg-1: #fff0f6;
        --female-bg-2: #ffe4f1;
        --female-accent-1: #ffc4dd;
        --female-accent-2: #ffb3d9;
        --female-highlight: #ff6b9d;
        --female-text: #4a4a4a;
        --female-glass: rgba(255, 255, 255, 0.6);
      }

      body {
        font-family:
          "DM Sans",
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 40px 0;
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* ========== ANIMATED BACKGROUNDS ========== */

      /* Male Theme - Cyberpunk Mesh */
      body.male-theme {
        background: linear-gradient(
          135deg,
          var(--male-bg-1) 0%,
          var(--male-bg-2) 100%
        );
        color: var(--male-text);
      }

      body.male-theme::before {
        content: "";
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background:
          radial-gradient(
            circle at 20% 30%,
            var(--male-accent-1) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 70%,
            var(--male-accent-2) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 50% 50%,
            var(--male-highlight) 0%,
            transparent 30%
          );
        opacity: 0.4;
        animation: rotateGlow 25s linear infinite;
        z-index: 0;
        filter: blur(40px);
      }

      body.male-theme::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(
            45deg,
            transparent 48%,
            rgba(233, 69, 96, 0.03) 49%,
            rgba(233, 69, 96, 0.03) 51%,
            transparent 52%
          ),
          linear-gradient(
            -45deg,
            transparent 48%,
            rgba(102, 126, 234, 0.03) 49%,
            rgba(102, 126, 234, 0.03) 51%,
            transparent 52%
          );
        background-size: 30px 30px;
        z-index: 0;
        animation: moveGrid 20s linear infinite;
      }

      @keyframes rotateGlow {
        0% {
          transform: rotate(0deg) scale(1);
        }
        50% {
          transform: rotate(180deg) scale(1.1);
        }
        100% {
          transform: rotate(360deg) scale(1);
        }
      }
      @keyframes moveGrid {
        0% {
          background-position:
            0 0,
            0 0;
        }
        100% {
          background-position:
            30px 30px,
            -30px -30px;
        }
      }

      /* Female Theme - Dreamy Waves */
      body.female-theme {
        background: linear-gradient(
          135deg,
          var(--female-bg-1) 0%,
          var(--female-bg-2) 100%
        );
        color: var(--female-text);
      }

      body.female-theme::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(255, 182, 193, 0.4) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 100%,
            rgba(255, 218, 224, 0.4) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 50% 50%,
            rgba(255, 192, 203, 0.3) 0%,
            transparent 60%
          );
        z-index: 0;
        animation: breatheWaves 8s ease-in-out infinite;
      }

      body.female-theme::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0 Q45 15 30 30 Q15 15 30 0' fill='rgba(255,182,193,0.05)' /%3E%3C/svg%3E");
        z-index: 0;
        animation: floatPattern 15s linear infinite;
        opacity: 0.6;
      }

      @keyframes breatheWaves {
        0%,
        100% {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
        50% {
          transform: scale(1.05) translateY(-20px);
          opacity: 0.8;
        }
      }
      @keyframes floatPattern {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-60px);
        }
      }

      /* Floating Orbs */
      .floating-orbs {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.3;
        animation: floatOrb 20s ease-in-out infinite;
      }
      .male-theme .orb:nth-child(1) {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, #e94560, transparent);
        top: -150px;
        left: -150px;
        animation-delay: 0s;
      }
      .male-theme .orb:nth-child(2) {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, #667eea, transparent);
        bottom: -200px;
        right: -200px;
        animation-delay: 5s;
      }
      .male-theme .orb:nth-child(3) {
        width: 250px;
        height: 250px;
        background: radial-gradient(circle, #764ba2, transparent);
        top: 50%;
        left: 50%;
        animation-delay: 10s;
      }
      .female-theme .orb:nth-child(1) {
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, #ffc4dd, transparent);
        top: -100px;
        right: -100px;
        animation-delay: 0s;
      }
      .female-theme .orb:nth-child(2) {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, #ff9a9e, transparent);
        bottom: -150px;
        left: -150px;
        animation-delay: 7s;
      }
      .female-theme .orb:nth-child(3) {
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, #ffb3d9, transparent);
        top: 30%;
        right: 20%;
        animation-delay: 14s;
      }
      @keyframes floatOrb {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        25% {
          transform: translate(50px, -50px) scale(1.1);
        }
        50% {
          transform: translate(-30px, 30px) scale(0.9);
        }
        75% {
          transform: translate(40px, 60px) scale(1.05);
        }
      }

      /* Floating Particles */
      .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        animation: float 15s infinite ease-in-out;
      }
      .male-theme .particle {
        background: radial-gradient(
          circle,
          rgba(233, 69, 96, 0.6),
          transparent
        );
        box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
      }
      .female-theme .particle {
        background: radial-gradient(
          circle,
          rgba(255, 182, 193, 0.6),
          transparent
        );
        box-shadow: 0 0 15px rgba(255, 182, 193, 0.3);
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) translateX(0) scale(0);
          opacity: 0;
        }
        5% {
          opacity: 1;
          transform: scale(1);
        }
        95% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) translateX(100px) scale(0.5);
          opacity: 0;
        }
      }

      /* ========== CUSTOM TOAST NOTIFICATION ========== */
      .toast-container {
        position: fixed;
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10000;
        pointer-events: none;
      }
      .toast {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(30px) saturate(180%);
        padding: 20px 30px;
        border-radius: 20px;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(255, 255, 255, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
        display: flex;
        align-items: center;
        gap: 15px;
        min-width: 320px;
        max-width: 90vw;
        transform: translateY(-150%) scale(0.8);
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        pointer-events: all;
        border: 2px solid transparent;
      }
      .toast.show {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      .toast.warning {
        border-color: #ff9800;
      }
      .toast.success {
        border-color: #4caf50;
      }
      .toast.info {
        border-color: #2196f3;
      }
      .toast-error {
        border-color: #f44336;
      }
      .toast-icon {
        font-size: 32px;
        flex-shrink: 0;
        animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      @keyframes bounceIn {
        0% {
          transform: scale(0);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }
      .toast-content {
        flex: 1;
      }
      .toast-title {
        font-size: 16px;
        font-weight: 700;
        color: #333;
        margin-bottom: 4px;
      }
      .toast-message {
        font-size: 14px;
        color: #666;
        line-height: 1.4;
      }
      .toast-close {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.05);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: #999;
        transition: all 0.3s ease;
        flex-shrink: 0;
      }
      .toast-close:hover {
        background: rgba(0, 0, 0, 0.1);
        transform: rotate(90deg);
        color: #333;
      }

      /* ========== MODAL & UI COMPONENTS ========== */
      .gender-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(20px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        animation: fadeIn 0.5s ease;
      }
      .gender-modal.hidden {
        display: none;
      }
      .gender-content {
        text-align: center;
        padding: 60px 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: scaleIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        max-width: 500px;
        width: 90%;
      }
      @keyframes scaleIn {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .gender-content h2 {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 16px;
        background: linear-gradient(90deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gender-content p {
        font-size: 16px;
        color: #666;
        margin-bottom: 40px;
      }
      .gender-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
      }
      .gender-btn {
        padding: 20px 40px;
        font-size: 18px;
        font-weight: 700;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }
      .gender-btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition:
          width 0.6s,
          height 0.6s;
      }
      .gender-btn:hover::before {
        width: 300px;
        height: 300px;
      }
      .gender-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      }
      .gender-btn:active {
        transform: translateY(-2px) scale(0.98);
      }
      .gender-btn.male {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .gender-btn.female {
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        color: white;
      }

      /* Dynamic Island */
      .dynamic-island {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) scale(0);
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(30px) saturate(180%);
        padding: 14px 28px;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        font-weight: 600;
        z-index: 1000;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        font-family: "Space Mono", monospace;
        color: white;
      }
      .dynamic-island.active {
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }
      .island-pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #30d158;
        animation: pulse 2s ease-in-out infinite;
        box-shadow: 0 0 10px #30d158;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.6;
          transform: scale(1.3);
        }
      }

      /* Main Container */
      .container {
        width: 90%;
        max-width: 520px;
        padding: 50px 40px;
        border-radius: 40px;
        position: relative;
        z-index: 10;
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        backdrop-filter: blur(40px) saturate(150%);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: all 0.5s ease;
        margin-top: 20px;
      }
      .male-theme .container {
        background: rgba(255, 255, 255, 0.05);
      }
      .female-theme .container {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 182, 193, 0.3);
      }
      @keyframes fadeInUp {
        0% {
          opacity: 0;
          transform: translateY(40px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 30px;
      }
      .header h1 {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -1px;
        margin-bottom: 8px;
        animation: slideInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .male-theme .header h1 {
        background: linear-gradient(90deg, #e94560, #ff6b9d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .female-theme .header h1 {
        background: linear-gradient(90deg, #ff6b9d, #c06c84);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @keyframes slideInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .mode-indicator {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.7;
        animation: fadeIn 1s ease 0.2s both;
      }

      /* Stats */
      .stats {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin: 20px 0;
        animation: fadeIn 1s ease 0.4s both;
      }
      .stat-item {
        padding: 12px 20px;
        border-radius: 16px;
        backdrop-filter: blur(10px);
        font-size: 13px;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .male-theme .stat-item {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .female-theme .stat-item {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 182, 193, 0.2);
      }
      .stat-item:hover {
        transform: translateY(-3px) scale(1.05);
      }
      .stat-value {
        font-size: 18px;
        font-weight: 800;
        display: block;
      }
      .male-theme .stat-value {
        color: #e94560;
      }
      .female-theme .stat-value {
        color: #ff6b9d;
      }

      /* Timer Circle */
      .timer-display {
        text-align: center;
        margin: 40px 0;
        position: relative;
      }
      .timer-circle {
        width: 280px;
        height: 280px;
        margin: 0 auto;
        position: relative;
        animation: scaleIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
      }
      .timer-circle::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle,
          rgba(233, 69, 96, 0.2) 0%,
          transparent 70%
        );
        transform: translate(-50%, -50%);
        animation: breathe 3s ease-in-out infinite;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.5;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
          opacity: 0.8;
        }
      }
      .timer-circle svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
        filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.3));
      }
      .progress-ring-bg {
        fill: none;
        stroke-width: 10;
        opacity: 0.15;
      }
      .male-theme .progress-ring-bg {
        stroke: #e94560;
      }
      .female-theme .progress-ring-bg {
        stroke: #ff6b9d;
      }
      .progress-ring {
        fill: none;
        stroke-width: 10;
        stroke-linecap: round;
        transition: stroke-dashoffset 1s linear;
      }
      .male-theme .progress-ring {
        stroke: url(#maleGradient);
      }
      .female-theme .progress-ring {
        stroke: url(#femaleGradient);
      }
      .time {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 56px;
        font-weight: 900;
        letter-spacing: -2px;
        font-family: "Space Mono", monospace;
        text-shadow: 0 2px 30px rgba(0, 0, 0, 0.1);
      }

      /* Caption */
      .caption {
        text-align: center;
        margin: 30px 0;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .caption-text {
        font-size: 17px;
        font-weight: 500;
        line-height: 1.6;
        font-style: italic;
        animation: fadeIn 0.8s ease;
        max-width: 400px;
      }
      .male-theme .caption-text {
        color: rgba(255, 255, 255, 0.8);
      }
      .female-theme .caption-text {
        color: rgba(0, 0, 0, 0.7);
      }

      /* Presets */
      .presets {
        display: flex;
        gap: 10px;
        margin: 25px 0;
        flex-wrap: wrap;
        justify-content: center;
      }
      .preset-btn {
        padding: 12px 24px;
        border-radius: 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
        border: 1px solid;
        animation: fadeIn 0.6s ease both;
      }
      .preset-btn:nth-child(1) {
        animation-delay: 0.5s;
      }
      .preset-btn:nth-child(2) {
        animation-delay: 0.6s;
      }
      .preset-btn:nth-child(3) {
        animation-delay: 0.7s;
      }
      .preset-btn:nth-child(4) {
        animation-delay: 0.8s;
      }
      .preset-btn:nth-child(5) {
        animation-delay: 0.9s;
      }
      .male-theme .preset-btn {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 0.9);
      }
      .female-theme .preset-btn {
        background: rgba(255, 255, 255, 0.6);

                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            `;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add("show"), 10);
        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 500);
        }, duration);
      }

      // ========== PARTICLE SYSTEM ==========
      function generateParticles() {
        const particlesContainer = document.getElementById("particles");
        particlesContainer.innerHTML = "";
        for (let i = 0; i < 25; i++) {
          const particle = document.createElement("div");
          particle.className = "particle";
          const size = Math.random() * 4 + 2;
          particle.style.width = size + "px";
          particle.style.height = size + "px";
          particle.style.left = Math.random() * 100 + "%";
          particle.style.animationDelay = Math.random() * 15 + "s";
          particle.style.animationDuration = 12 + Math.random() * 8 + "s";
          particlesContainer.appendChild(particle);
        }
      }

      // ========== GENDER SELECTION ==========
      function selectGender(gender) {
        currentTheme = gender;
        document.body.className = gender + "-theme";
        genderModal.classList.add("hidden");

        if (gender === "male") {
          focusCaptions = maleFocusCaptions;
          breakCaptions = maleBreakCaptions;
        } else {
          focusCaptions = femaleFocusCaptions;
          breakCaptions = femaleBreakCaptions;
        }

        changeCaption();
        generateParticles();
        updateStatsDisplay();

        showToast(
          "success",
          "Theme applied!",
          `The aesthetic has been updated 🎨`,
        );
      }

      function toggleTheme() {
        const newTheme = currentTheme === "male" ? "female" : "male";
        selectGender(newTheme);
      }

      // ========== STATS & DISPLAY ==========
      function updateStatsDisplay() {
        document.getElementById("sessionCount").textContent = sessionCount;
        document.getElementById("totalMinutes").textContent = totalMinutes;
        document.getElementById("streakCount").textContent = streakCount;
      }

      function updateDisplay() {
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        const timeStr = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        timerDisplay.textContent = timeStr;

        if (isRunning) {
          document.title = `${timeStr} - Focus Timer ⏱️`;
        } else {
          document.title = "Focus Timer ⏱️";
        }

        const progress = remainingSeconds / totalSeconds;
        const offset = circumference * (1 - progress);
        progressRing.style.strokeDashoffset = offset;

        if (isRunning) {
          islandText.textContent = timeStr;
        }
      }

      // ========== TIMER CONTROLS ==========
      function setTimer(minutes) {
        if (isRunning) return;
        totalSeconds = minutes * 60;
        remainingSeconds = totalSeconds;
        updateDisplay();
        changeCaption();
      }

      function setCustomTimer() {
        const customMinutes = parseInt(
          document.getElementById("customMinutes").value,
        );
        if (customMinutes && customMinutes > 0 && customMinutes <= 120) {
          setTimer(customMinutes);
          document.getElementById("customMinutes").value = "";
          showToast(
            "info",
            "Timer set!",
            `${customMinutes} minutes - Ready to grind! 💪`,
          );
        }
      }

      function startTimer() {
        if (isRunning) {
          clearInterval(timerInterval);
          isRunning = false;
          startBtn.textContent = "Resume";
          dynamicIsland.classList.remove("active");
        } else {
          isRunning = true;
          startBtn.textContent = "Pause";
          dynamicIsland.classList.add("active");

          timerInterval = setInterval(() => {
            remainingSeconds--;
            updateDisplay();

            if (remainingSeconds <= 0) {
              clearInterval(timerInterval);
              isRunning = false;
              startBtn.textContent = "Start";
              dynamicIsland.classList.remove("active");

              const duration = Math.floor(totalSeconds / 60);

              if (!isBreakMode) {
                sessionCount++;
                totalMinutes += duration;
                streakCount++;
                if (streakCount > maxStreak) maxStreak = streakCount;

                sessionHistory.push({
                  timestamp: new Date(),
                  duration: duration,
                  type: "focus",
                });

                updateStatsDisplay();
                showToast(
                  "success",
                  "🎉 Session completed!",
                  `+${duration} mins tracked! Streak: ${streakCount} 🔥`,
                );
              } else {
                totalBreakMinutes += duration;
              }

              if (notificationEnabled) {
                playNotification();
                showNotification();
              }

              switchMode();
            }
          }, 1000);
        }
      }

      function resetTimer() {
        clearInterval(timerInterval);
        isRunning = false;
        remainingSeconds = totalSeconds;
        updateDisplay();
        startBtn.textContent = "Start";
        dynamicIsland.classList.remove("active");
        changeCaption();
      }

      function switchMode() {
        isBreakMode = !isBreakMode;
        if (isBreakMode) {
          modeIndicator.textContent = "BREAK MODE";
          totalSeconds = 5 * 60;
          remainingSeconds = totalSeconds;
        } else {
          modeIndicator.textContent = "FOCUS MODE";
          totalSeconds = 25 * 60;
          remainingSeconds = totalSeconds;
        }
        updateDisplay();
        changeCaption();
      }

      function changeCaption() {
        const captions = isBreakMode ? breakCaptions : focusCaptions;
        const randomCaption =
          captions[Math.floor(Math.random() * captions.length)];
        captionText.style.animation = "none";
        setTimeout(() => {
          captionText.textContent = randomCaption;
          captionText.style.animation = "fadeIn 0.8s ease";
        }, 50);
      }

      // ========== AUDIO & NOTIFICATIONS ==========
      function playNotification() {
        const audioContext = new (
          window.AudioContext || window.webkitAudioContext
        )();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(
          400,
          audioContext.currentTime + 0.5,
        );
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(
          0.01,
          audioContext.currentTime + 0.5,
        );
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.5);
      }

      function showNotification() {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("Focus Timer", {
            body: isBreakMode
              ? "Time's up! Take a break. 🎉"
              : "Break is over! Let's get back to work. 💪",
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">⏱️</text></svg>',
          });
        }
      }

      // ========== PDF EXPORT (PRO APPLE WWDC DARK MODE) ==========
      async function exportPDF() {
        if (sessionCount === 0) {
          showToast(
            "warning",
            "No data yet!",
            "Complete at least 1 focus session before exporting! 😎",
            5000,
          );
          return;
        }

        showToast(
          "info",
          "Generating Report...",
          "Creating a 5-star dashboard for your IG Story 📸",
          3000,
        );

        const template = document.getElementById("pdf-export-template");

        // Cố đợi font load xong để html2canvas không bị vỡ font (nếu mạng yếu)
        await document.fonts.ready;

        // Calculations for Pro Stats
        const totalOverallTime = totalMinutes + totalBreakMinutes;
        const focusPct =
          totalOverallTime === 0
            ? 100
            : Math.round((totalMinutes / totalOverallTime) * 100);
        const avgSession =
          sessionCount > 0 ? Math.round(totalMinutes / sessionCount) : 0;
        // Productivity score (Max 100) based on an ambitious 180 min goal
        const prodScore = Math.min(100, Math.round((totalMinutes / 180) * 100));

        // Chart Colors
        const chartGradientStart = "#FF2E93";
        const chartGradientEnd = "#FF8000";

        // Xây dựng Timeline Bars HTML (Max 6 sessions for clean look)
        const maxDuration = Math.max(
          ...sessionHistory.map((s) => s.duration),
          1,
        );
        let timelineHTML = "";
        const displayHistory = sessionHistory.slice(-6);

        displayHistory.forEach((session) => {
          const widthPercent = (session.duration / maxDuration) * 100;
          const timeStr = session.timestamp.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
          });
          timelineHTML += `
                <div class="pdf-timeline-row">
                    <div class="pdf-timeline-time">${timeStr}</div>
                    <div class="pdf-timeline-bar-wrapper">
                        <div class="pdf-timeline-bar" style="width: ${widthPercent}%;"></div>
                    </div>
                    <div class="pdf-timeline-mins">${session.duration}m</div>
                </div>
            `;
        });

        // ================= VẼ BIỂU ĐỒ SÓNG CỰC MƯỢT (WAVE CHART) =================
        const focusSessions = sessionHistory.filter((s) => s.type === "focus");
        const chartW = 320;
        const chartH = 140;
        const stepX =
          focusSessions.length > 1
            ? chartW / (focusSessions.length - 1)
            : chartW;

        let pathD = `M 0 ${chartH} `;
        let lineD = "";

        if (focusSessions.length === 1) {
          const y = chartH - (focusSessions[0].duration / maxDuration) * chartH;
          pathD += `L 0 ${y} L ${chartW} ${y} L ${chartW} ${chartH} Z`;
          lineD = `M 0 ${y} L ${chartW} ${y}`;
        } else {
          lineD = `M 0 ${chartH - (focusSessions[0].duration / maxDuration) * chartH} `;
          focusSessions.forEach((s, i) => {
            const x = i * stepX;
            const y = chartH - (s.duration / maxDuration) * chartH;
            pathD += `L ${x} ${y} `;
            if (i > 0) lineD += `L ${x} ${y} `;
          });
          pathD += `L ${chartW} ${chartH} Z`;
        }

        // Fix lỗi shadow html2canvas bằng cách vẽ một path mờ chồng lên sau thay vì CSS drop-shadow
        const waveSVG = `
            <svg width="100%" height="150" viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="${chartGradientStart}" stop-opacity="0.8"/>
                        <stop offset="100%" stop-color="${chartGradientEnd}" stop-opacity="0.0"/>
                    </linearGradient>
                </defs>
                <path d="${pathD}" fill="url(#waveGrad)" />
                <path d="${lineD}" fill="none" stroke="${chartGradientStart}" stroke-opacity="0.3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
                <path d="${lineD}" fill="none" stroke="${chartGradientStart}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                ${focusSessions
                  .map((s, i) => {
                    const x =
                      focusSessions.length === 1 ? chartW / 2 : i * stepX;
                    const y = chartH - (s.duration / maxDuration) * chartH;
                    return `<circle cx="${x}" cy="${y}" r="5" fill="#fff" stroke="${chartGradientStart}" stroke-width="3" />`;
                  })
                  .join("")}
            </svg>
        `;

        // ================= VẼ BIỂU ĐỒ TRÒN NEON =================
        const donutRadius = 65;
        const donutCircum = 2 * Math.PI * donutRadius;
        const focusDash = (focusPct / 100) * donutCircum;
        const donutSVG = `
            <svg width="160" height="160" viewBox="0 0 160 160">
                <defs>
                  <linearGradient id="donutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="${chartGradientStart}" />
                    <stop offset="100%" stop-color="${chartGradientEnd}" />
                  </linearGradient>
                </defs>
                <circle cx="80" cy="80" r="${donutRadius}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="16" />
                <circle cx="80" cy="80" r="${donutRadius}" fill="none" stroke="url(#donutGrad)" stroke-width="16" stroke-linecap="round"
                        stroke-dasharray="${donutCircum}" stroke-dashoffset="${donutCircum - focusDash}" transform="rotate(-90 80 80)" />
            </svg>
        `;

        // Slogan Tiếng Việt
        const quotes =
          currentTheme === "male"
            ? [
                "Cày sâu cuốc bẫm, ngày sau gáy to! 💎",
                "Hôm nay chạy code, ngày mai chạy Mẹc! 🚀",
                "Kỷ luật thép tạo nên kim cương! ⚡",
              ]
            : [
                "Xinh đẹp và giỏi giang, tớ có cả hai! 💕",
                "Mỗi phút trôi qua đều tỏa sáng! ✨",
                "Sự tập trung làm nên thần thái! 🌸",
              ];
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];

        const dateOptions = { month: "short", day: "numeric", year: "numeric" };
        const dateStr = sessionStartTime
          .toLocaleDateString("en-US", dateOptions)
          .toUpperCase();

        // Template HTML (Apple Pro Style)
        template.innerHTML = `
            <div class="pdf-glow-1"></div>
            <div class="pdf-glow-2"></div>
            
            <div class="pdf-content-wrapper">
                <div class="pdf-header">
                    <div>
                        <h1>FOCUS REPORT</h1>
                        <p>${dateStr} SESSION</p>
                    </div>
                    <div style="font-size: 52px; color: white;">⏱️</div>
                </div>
                
                <div class="pdf-kpi-grid">
                    <div class="pdf-kpi-card">
                        <div class="kpi-label">TOTAL FOCUS</div>
                        <div class="kpi-val"><span id="pdf-total-time">${totalMinutes}</span><span class="unit">min</span></div>
                    </div>
                    <div class="pdf-kpi-card">
                        <div class="kpi-label">SESSIONS</div>
                        <div class="kpi-val"><span>${sessionCount}</span></div>
                    </div>
                    <div class="pdf-kpi-card">
                        <div class="kpi-label">LONGEST STREAK</div>
                        <div class="kpi-val"><span>${maxStreak}</span><span class="unit">🔥</span></div>
                    </div>
                    <div class="pdf-kpi-card">
                        <div class="kpi-label">AVG SESSION</div>
                        <div class="kpi-val"><span>${avgSession}</span><span class="unit">min</span></div>
                    </div>
                    <div class="pdf-kpi-card kpi-highlight">
                        <div class="kpi-label" style="color: rgba(255,255,255,0.9)">PRODUCTIVITY SCORE</div>
                        <div class="kpi-val"><span>${prodScore}</span><span class="unit" style="color: rgba(255,46,147,0.7)">/100</span></div>
                    </div>
                    <div class="pdf-kpi-card">
                        <div class="kpi-label">FOCUS RATIO</div>
                        <div class="kpi-val"><span>${focusPct}</span><span class="unit">%</span></div>
                    </div>
                </div>

                <div class="pdf-charts-row">
                    <div class="pdf-chart-card">
                        <div class="pdf-chart-title">ACTIVITY WAVE</div>
                        <div style="flex: 1; display: flex; align-items: flex-end; width: 100%;">
                            ${waveSVG}
                        </div>
                    </div>
                    <div class="pdf-chart-card" style="align-items: center; text-align: center;">
                        <div class="pdf-chart-title">FOCUS VS BREAK</div>
                        <div style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative;">
                            <!-- Fake glow layer cho SVG donut an toàn với html2canvas -->
                            <div style="position: absolute; width: 120px; height: 120px; background: radial-gradient(circle, rgba(255,46,147,0.4) 0%, transparent 70%); z-index: 0;"></div>
                            <div style="position: relative; z-index: 1;">${donutSVG}</div>
                            <div style="position: absolute; font-size: 26px; font-weight: 900; font-family: 'Space Mono', monospace; z-index: 2; color: #fff;">${focusPct}%</div>
                        </div>
                    </div>
                </div>

                <div class="pdf-chart-card" style="flex: 1; margin-bottom: 0;">
                    <div class="pdf-chart-title">RECENT SESSIONS</div>
                    <div class="pdf-timeline">
                        ${timelineHTML}
                    </div>
                </div>

                <div class="pdf-footer">
                    <div class="pdf-quote">"${randomQuote}"</div>
                    <div class="pdf-watermark">⚡ POWERED BY MOSHI ⚡</div>
                </div>
            </div>
        `;

        try {
          const canvas = await html2canvas(template, {
            scale: 2,
            backgroundColor: "#09090b",
            logging: false,
            useCORS: true,
            allowTaint: true,
          });

          const imgData = canvas.toDataURL("image/png");

          // FIX LỖI CẮT XÉN (Cut-off):
          // Thay vì cố nhét vào A4, tạo một khung PDF Custom đúng tỷ lệ Pixel của Canvas!
          const pdfWidth = canvas.width;
          const pdfHeight = canvas.height;

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: "portrait",
            unit: "px",
            format: [pdfWidth, pdfHeight],
          });

          pdf.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);

          const fileName = `Focus_Report_Moshi_${new Date().toISOString().slice(0, 10)}.pdf`;
          pdf.save(fileName);

          showToast(
            "success",
            "✅ Export Successful!",
            "Report generated and ready for your Story! 📸",
            6000,
          );
        } catch (error) {
          console.error("PDF Render Error:", error);
          showToast(
            "error",
            "Export Failed!",
            "Something went wrong. Please try again.",
            4000,
          );
        }
      }

      // ========== KEYBOARD SHORTCUTS ==========
      document.addEventListener("keydown", (e) => {
        if (e.code === "Space" && genderModal.classList.contains("hidden")) {
          e.preventDefault();
          startTimer();
        } else if (e.code === "KeyR") {
          resetTimer();
        } else if (e.code === "KeyE" && e.ctrlKey) {
          e.preventDefault();
          exportPDF();
        }
      });

      // ========== INITIALIZATION ==========
      updateDisplay();

      if ("Notification" in window && Notification.permission === "default") {
        setTimeout(() => {
          Notification.requestPermission();
        }, 3000);
      }
    </script>
  </body>
</html>
