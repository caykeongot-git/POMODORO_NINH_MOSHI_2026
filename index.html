<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Pomodoro</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230D1520'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%2367C6F5' stroke-width='2.5' stroke-dasharray='46 16' transform='rotate(-90 16 16)'/%3E%3Ccircle cx='16' cy='6.5' r='2' fill='%23E8F3FC'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ========== MATTE GLACIAL SLATE TOKENS (SINGLE COLD THEME) ========== */
      :root {
        --bg-base: #0d1520;
        --bg-surface: #131e2e;
        --bg-control: #1a283d;
        --bg-control-hover: #21324c;
        --border-hairline: rgba(186, 224, 250, 0.09);
        --border-hover: rgba(186, 224, 250, 0.22);
        --text-primary: #e8f3fc;
        --text-secondary: #9bb4ce;
        --text-muted: #6884a3;
        --ice-accent: #67c6f5;
        --ice-track: rgba(155, 180, 206, 0.14);
        --btn-primary-bg: #e0f2fe;
        --btn-primary-bg-hover: #f0f9ff;
        --btn-primary-fg: #091928;
        --danger: #f87171;
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-base);
        background-image: radial-gradient(
          ellipse 80% 55% at 50% 0%,
          rgba(103, 198, 245, 0.055) 0%,
          transparent 70%
        );
        color: var(--text-primary);
        min-height: 100dvh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      button,
      input {
        font-family: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
        background: none;
        border: none;
      }

      :focus-visible {
        outline: 2px solid var(--ice-accent);
        outline-offset: 2px;
      }

      /* ========== APP SHELL ========== */
      .app-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 20px clamp(18px, 4vw, 44px);
      }

      /* ========== MINIMAL FLOATING HEADER ========== */
      .app-header {
        position: relative;
        z-index: 20;
        width: 100%;
        max-width: 1160px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        gap: 12px;
        transition: opacity 0.45s var(--ease-out);
      }

      body.is-running .app-header {
        opacity: 0.48;
      }

      body.is-running .app-header:hover,
      body.is-running .app-header:focus-within,
      body.popover-open .app-header {
        opacity: 1;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        justify-self: start;
        color: var(--text-secondary);
        font-size: 0.9rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .brand svg {
        color: var(--ice-accent);
      }

      .live-clock {
        justify-self: center;
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.86rem;
        font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 0.04em;
      }

      .header-actions {
        justify-self: end;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        position: relative;
      }

      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        background: transparent;
        border: 1px solid transparent;
        transition:
          background-color 0.2s var(--ease-out),
          border-color 0.2s var(--ease-out),
          color 0.2s var(--ease-out),
          transform 0.18s var(--ease-out);
      }

      .icon-btn:hover {
        color: var(--text-primary);
        background: var(--bg-surface);
        border-color: var(--border-hairline);
      }

      .icon-btn:active {
        transform: scale(0.94);
      }

      .icon-btn.is-active {
        color: var(--ice-accent);
        background: var(--bg-surface);
        border-color: var(--border-hover);
      }

      /* ========== HERO FOCUS STAGE ========== */
      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(22px, 3.6vh, 34px);
        padding: 20px 0 32px;
      }

      /* Mode Switcher */
      .mode-switch {
        position: relative;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: min(356px, 92vw);
        padding: 4px;
        border-radius: 12px;
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        --seg-idx: 0;
      }

      .mode-pill {
        position: absolute;
        top: 4px;
        left: 4px;
        bottom: 4px;
        width: calc((100% - 8px) / 3);
        border-radius: 8px;
        background: var(--bg-control);
        border: 1px solid var(--border-hairline);
        transform: translate3d(calc(var(--seg-idx) * 100%), 0, 0);
        transition: transform 0.36s var(--ease-out);
        will-change: transform;
        pointer-events: none;
      }

      .mode-btn {
        position: relative;
        z-index: 1;
        height: 34px;
        font-size: 0.82rem;
        font-weight: 500;
        color: var(--text-muted);
        border-radius: 8px;
        transition: color 0.22s var(--ease-out);
      }

      .mode-btn:hover {
        color: var(--text-secondary);
      }

      .mode-btn.active {
        color: var(--text-primary);
      }

      /* Chronometer Ring */
      .chronometer {
        position: relative;
        width: min(404px, 86vw);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
      }

      .chrono-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .chrono-track {
        fill: none;
        stroke: var(--ice-track);
        stroke-width: 4.5;
      }

      .chrono-arc {
        fill: none;
        stroke: var(--ice-accent);
        stroke-width: 4.5;
        stroke-linecap: round;
        transform: rotate(-90deg);
        transform-origin: 180px 180px;
      }

      .chrono-tip {
        fill: var(--text-primary);
        transition: opacity 0.25s ease;
      }

      .chrono-inner {
        position: absolute;
        inset: 42px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 10px;
        pointer-events: none;
      }

      .chrono-digits {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: clamp(4.2rem, 8vw, 5.75rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--text-primary);
      }

      .task-inline-input {
        pointer-events: auto;
        width: min(230px, 60vw);
        background: transparent;
        border: none;
        border-bottom: 1px solid transparent;
        padding: 4px 6px;
        text-align: center;
        font-size: 0.86rem;
        font-weight: 400;
        color: var(--text-secondary);
        transition:
          border-color 0.2s var(--ease-out),
          color 0.2s var(--ease-out);
      }

      .task-inline-input::placeholder {
        color: var(--text-muted);
      }

      .task-inline-input:hover {
        border-bottom-color: var(--border-hairline);
      }

      .task-inline-input:focus {
        outline: none;
        color: var(--text-primary);
        border-bottom-color: var(--ice-accent);
      }

      .eta-line {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 0.76rem;
        color: var(--text-muted);
        opacity: 0;
        transform: translate3d(0, 4px, 0);
        transition:
          opacity 0.3s var(--ease-out),
          transform 0.3s var(--ease-out);
      }

      body.is-running .eta-line {
        opacity: 1;
        transform: translate3d(0, 0, 0);
      }

      /* Primary Controls */
      .controls-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .controls-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .btn-primary {
        height: 46px;
        min-width: 136px;
        padding: 0 24px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 0.92rem;
        font-weight: 600;
        background: var(--btn-primary-bg);
        color: var(--btn-primary-fg);
        transition:
          background-color 0.2s var(--ease-out),
          transform 0.18s var(--ease-out);
        will-change: transform;
      }

      .btn-primary:hover {
        background: var(--btn-primary-bg-hover);
      }

      .btn-primary:active {
        transform: scale(0.96);
      }

      .btn-secondary {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        transition:
          background-color 0.2s var(--ease-out),
          border-color 0.2s var(--ease-out),
          color 0.2s var(--ease-out),
          transform 0.18s var(--ease-out);
      }

      .btn-secondary:hover {
        color: var(--text-primary);
        background: var(--bg-control);
        border-color: var(--border-hover);
      }

      .btn-secondary:active {
        transform: scale(0.94);
      }

      /* Presets Row (Auto-fades cleanly while running) */
      .presets-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition:
          opacity 0.35s var(--ease-out),
          transform 0.35s var(--ease-out);
        will-change: opacity, transform;
      }

      body.is-running .presets-row {
        opacity: 0;
        transform: translate3d(0, 8px, 0);
        pointer-events: none;
      }

      .preset-btn {
        height: 30px;
        padding: 0 11px;
        border-radius: 8px;
        font-size: 0.78rem;
        font-weight: 500;
        font-family: var(--font-mono);
        color: var(--text-muted);
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
        transition:
          color 0.2s var(--ease-out),
          background-color 0.2s var(--ease-out),
          border-color 0.2s var(--ease-out),
          transform 0.16s var(--ease-out);
      }

      .preset-btn:hover {
        color: var(--text-primary);
        border-color: var(--border-hover);
      }

      .preset-btn.active {
        color: var(--ice-accent);
        background: var(--bg-control);
        border-color: var(--border-hover);
      }

      .preset-btn:active {
        transform: scale(0.95);
      }

      .custom-form {
        display: inline-flex;
        align-items: center;
        height: 30px;
        padding: 0 4px 0 9px;
        gap: 4px;
        border-radius: 8px;
        background: var(--bg-surface);
        border: 1px solid var(--border-hairline);
      }

      .custom-input {
        width: 38px;
        background: transparent;
        border: none;
        outline: none;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--text-primary);
      }

      .custom-input::placeholder {
        color: var(--text-muted);
      }

      .custom-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
      }

      .custom-set-btn {
        height: 22px;
        padding: 0 8px;
        border-radius: 5px;
        font-size: 0.73rem;
        font-weight: 500;
        color: var(--text-secondary);
        background: var(--bg-control);
        transition: background-color 0.18s ease, color 0.18s ease;
      }

      .custom-set-btn:hover {
        background: var(--bg-control-hover);
        color: var(--text-primary);
      }

      /* ========== POPOVERS (SOUND & STATS) ========== */
      .popover {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        width: 286px;
        padding: 16px;
        border-radius: 16px;
        background: var(--bg-surface);
        border: 1px solid var(--border-hover);
        box-shadow: 0 20px 48px rgba(4, 9, 17, 0.55);
        display: flex;
        flex-direction: column;
        gap: 14px;
        opacity: 0;
        transform: scale(0.96) translate3d(0, -6px, 0);
        transform-origin: top right;
        pointer-events: none;
        transition:
          opacity 0.22s var(--ease-out),
          transform 0.26s var(--ease-out);
        will-change: opacity, transform;
        z-index: 40;
      }

      .popover.open {
        opacity: 1;
        transform: scale(1) translate3d(0, 0, 0);
        pointer-events: auto;
      }

      .pop-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .pop-sub {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-family: var(--font-mono);
      }

      .sound-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .sound-opt {
        height: 36px;
        padding: 0 10px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        font-weight: 500;
        color: var(--text-secondary);
        background: var(--bg-control);
        border: 1px solid var(--border-hairline);
        transition:
          background-color 0.2s var(--ease-out),
          border-color 0.2s var(--ease-out),
          color 0.2s var(--ease-out),
          transform 0.16s var(--ease-out);
      }

      .sound-opt:hover {
        color: var(--text-primary);
        border-color: var(--border-hover);
      }

      .sound-opt.active {
        color: var(--ice-accent);
        background: var(--bg-control-hover);
        border-color: var(--ice-accent);
      }

      .sound-opt:active {
        transform: scale(0.96);
      }

      .vol-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .vol-head {
        display: flex;
        justify-content: space-between;
        font-size: 0.76rem;
        color: var(--text-secondary);
      }

      .ice-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background: var(--ice-track);
        outline: none;
      }

      .ice-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--text-primary);
        border: 2px solid var(--bg-surface);
        cursor: pointer;
        transition: transform 0.15s var(--ease-out);
      }

      .ice-slider::-webkit-slider-thumb:hover {
        transform: scale(1.18);
      }

      .ice-slider::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--text-primary);
        border: 2px solid var(--bg-surface);
        cursor: pointer;
      }

      .pop-divider {
        height: 1px;
        background: var(--border-hairline);
      }

      .pop-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.8rem;
        color: var(--text-secondary);
      }

      .switch-btn {
        position: relative;
        width: 36px;
        height: 20px;
        border-radius: 999px;
        background: var(--bg-control);
        border: 1px solid var(--border-hairline);
        transition: background-color 0.2s var(--ease-out), border-color 0.2s var(--ease-out);
      }

      .switch-btn::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--text-secondary);
        transition: transform 0.22s var(--ease-out), background-color 0.2s ease;
      }

      .switch-btn[aria-checked="true"] {
        background: var(--ice-accent);
        border-color: var(--ice-accent);
      }

      .switch-btn[aria-checked="true"]::after {
        transform: translate3d(16px, 0, 0);
        background: var(--btn-primary-fg);
      }

      .quiet-btn {
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        font-size: 0.78rem;
        font-weight: 500;
        color: var(--text-secondary);
        background: var(--bg-control);
        border: 1px solid var(--border-hairline);
        transition:
          background-color 0.2s var(--ease-out),
          border-color 0.2s var(--ease-out),
          color 0.2s var(--ease-out);
      }

      .quiet-btn:hover {
        color: var(--text-primary);
        background: var(--bg-control-hover);
        border-color: var(--border-hover);
      }

      .quiet-btn.confirm-danger {
        color: var(--danger);
        border-color: rgba(248, 113, 113, 0.45);
      }

      .stats-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .stat-cell {
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--bg-control);
        border: 1px solid var(--border-hairline);
      }

      .stat-val {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .stat-lbl {
        font-size: 0.72rem;
        color: var(--text-muted);
        margin-top: 2px;
      }

      /* ========== SINGLE-SLOT NON-STACKING TOAST ========== */
      .toast-pill {
        position: fixed;
        bottom: 24px;
        left: 50%;
        z-index: 60;
        padding: 9px 16px;
        border-radius: 999px;
        background: var(--bg-surface);
        border: 1px solid var(--border-hover);
        color: var(--text-primary);
        font-size: 0.8rem;
        font-weight: 500;
        pointer-events: none;
        opacity: 0;
        transform: translate3d(-50%, 10px, 0);
        transition:
          opacity 0.24s var(--ease-out),
          transform 0.28s var(--ease-out);
        will-change: opacity, transform;
      }

      .toast-pill.visible {
        opacity: 1;
        transform: translate3d(-50%, 0, 0);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <!-- Minimal Header -->
      <header class="app-header">
        <div class="brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <polyline points="12 7 12 12 15.5 14" />
          </svg>
          <span>Pomodoro</span>
        </div>

        <div class="live-clock" id="liveClock" aria-label="Current Time">00:00</div>

        <div class="header-actions">
          <button class="icon-btn" id="soundBtn" title="Ambient Sound &amp; Chime (M to mute)" aria-label="Sound Controls" aria-expanded="false">
            <svg id="soundBtnIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
            </svg>
          </button>

          <button class="icon-btn" id="statsBtn" title="Session Stats" aria-label="Session Stats" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 3v18h18" />
              <rect x="7" y="10" width="3" height="7" rx="1" />
              <rect x="12" y="6" width="3" height="11" rx="1" />
              <rect x="17" y="13" width="3" height="4" rx="1" />
            </svg>
          </button>

          <button class="icon-btn" id="fullscreenBtn" title="Fullscreen (F)" aria-label="Toggle Fullscreen">
            <svg id="fullscreenIcon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
            </svg>
          </button>

          <!-- Sound Popover -->
          <div class="popover" id="soundPopover" role="dialog" aria-label="Sound Settings">
            <div class="pop-title">
              <span>Ambient Sound</span>
              <span class="pop-sub" id="soundStatusText">Off</span>
            </div>

            <div class="sound-grid">
              <button type="button" class="sound-opt active" data-sound="off">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

              <button type="button" class="sound-opt" data-sound="rain">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
                  <path d="M16 14v6M8 14v6M12 16v6" />
                </svg>
                <span>Rain</span>
              </button>
              <button type="button" class="sound-opt" data-sound="wind">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2" />
                  <path d="M9.6 4.6A2 2 0 1 1 11 8H2" />

              <button type="button" class="sound-opt" data-sound="noise">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M2 12h3l2.5-6 4 12 3-8 2.5 2H22" />

                <span>Soft Noise</span>
              </button>
            </div>

            <div class="vol-row">
              <div class="vol-head">
                <span>Volume</span>
                <span class="pop-sub" id="volLabel">75%</span>
              </div>
              <input type="range" class="ice-slider" id="volumeSlider" min="0" max="100" value="75" aria-label="Master Volume" />
            </div>

            <div class="pop-divider"></div>

            <div class="pop-row">
              <span>Completion Chime</span>
              <button type="button" class="switch-btn" id="chimeSwitch" role="switch" aria-checked="true" aria-label="Toggle Completion Chime"></button>
            </div>

            <button type="button" class="quiet-btn" id="testChimeBtn">Test Chime</button>
          </div>

          <!-- Stats Popover -->
          <div class="popover" id="statsPopover" role="dialog" aria-label="Focus Statistics">
            <div class="pop-title">
              <span>Focus Stats</span>
              <span class="pop-sub" id="streakSub">0 streak</span>
            </div>

            <div class="stats-grid">
              <div class="stat-cell">
                <div class="stat-val" id="statTodaySessions">0</div>
                <div class="stat-lbl">Today Sessions</div>
              </div>
              <div class="stat-cell">
                <div class="stat-val" id="statTodayMin">0m</div>
                <div class="stat-lbl">Today Focus</div>
              </div>
              <div class="stat-cell">
                <div class="stat-val" id="statTotalSessions">0</div>
                <div class="stat-lbl">Total Sessions</div>
              </div>
              <div class="stat-cell">
                <div class="stat-val" id="statTotalHrs">0.0h</div>
                <div class="stat-lbl">Total Focus</div>
              </div>
            </div>

            <button type="button" class="quiet-btn" id="resetStatsBtn">Reset Stats</button>
          </div>
        </div>
      </header>

      <!-- Centered Focus Stage -->
      <main class="stage">
        <div class="mode-switch" id="modeSwitch" role="tablist" aria-label="Session Mode">
          <div class="mode-pill" aria-hidden="true"></div>
          <button type="button" class="mode-btn active" data-mode="focus" role="tab" aria-selected="true">Focus</button>
          <button type="button" class="mode-btn" data-mode="short" role="tab" aria-selected="false">Short Break</button>
          <button type="button" class="mode-btn" data-mode="long" role="tab" aria-selected="false">Long Break</button>
        </div>

        <div class="chronometer">
          <svg class="chrono-svg" viewBox="0 0 360 360" aria-hidden="true">
            <circle class="chrono-track" cx="180" cy="180" r="158" />
            <circle class="chrono-arc" id="chronoArc" cx="180" cy="180" r="158" />
            <circle class="chrono-tip" id="chronoTip" cx="180" cy="22" r="4.5" />
          </svg>

          <div class="chrono-inner">
            <div class="chrono-digits" id="timerDisplay">25:00</div>
            <input
              type="text"
              class="task-inline-input"
              id="taskInput"
              maxlength="64"
              placeholder="What are you focusing on?"
              autocomplete="off"
              aria-label="Current focus task"
            />
            <div class="eta-line" id="etaLine">Ends 00:00</div>
          </div>
        </div>

        <div class="controls-block">
          <div class="controls-row">
            <button type="button" class="btn-secondary" id="resetBtn" title="Reset (R)" aria-label="Reset Timer">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </button>

            <button type="button" class="btn-primary" id="startBtn">
              <svg id="startIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                <polygon points="6 4 20 12 6 20 6 4" />
              </svg>
              <span id="startLabel">Start</span>
            </button>

            <button type="button" class="btn-secondary" id="skipBtn" title="Skip Phase (S)" aria-label="Skip Phase">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 4 15 12 5 20 5 4" />
                <line x1="19" y1="5" x2="19" y2="19" />
              </svg>
            </button>
          </div>

          <div class="presets-row" id="presetsRow">
            <button type="button" class="preset-btn active" data-min="25">25m</button>
            <button type="button" class="preset-btn" data-min="45">45m</button>
            <button type="button" class="preset-btn" data-min="50">50m</button>
            <button type="button" class="preset-btn" data-min="60">60m</button>
            <form class="custom-form" id="customForm">
              <input
                type="number"
                class="custom-input"
                id="customInput"
                min="1"
                max="180"
                placeholder="Min"
                aria-label="Custom minutes"
              />
              <button type="submit" class="custom-set-btn">Set</button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <!-- Single-slot Toast -->
    <div class="toast-pill" id="toast" role="status" aria-live="polite"></div>

    <script>
      (() => {
        "use strict";

        const RING_RADIUS = 158;
        const RING_CIRC = 2 * Math.PI * RING_RADIUS;
        const MODE_MINS = { focus: 25, short: 5, long: 15 };
        const $ = (id) => document.getElementById(id);

        function clampInt(val, min, max, fallback) {
          const n = Number(val);
          if (!Number.isFinite(n)) return fallback;
          return Math.min(max, Math.max(min, Math.round(n)));
        }

        function safeJsonParse(raw, fallback) {
          if (!raw) return fallback;
          try {
            const p = JSON.parse(raw);
            return p ?? fallback;
          } catch {
            return fallback;
          }
        }

        function sanitizeText(str, maxLen) {
          if (typeof str !== "string") return "";
          return str.replace(/[\u0000-\u001F\u007F]/g, "").trim().slice(0, maxLen);
        }

        function formatMMSS(ms) {
          const totalSec = Math.max(0, Math.ceil(ms / 1000));
          const m = Math.floor(totalSec / 60);
          const s = totalSec % 60;
          return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        }

        function getDayKey(date) {
          const d = new Date(date);
          if (Number.isNaN(d.getTime())) return "";
          return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }

        /* ========== GUARANTEED-AUDIBLE WEB AUDIO ENGINE ========== */
        class SoundEngine {
          constructor() {
            this.ctx = null;
            this.compressor = null;
            this.masterGain = null;
            this.mode = "off"; // "off" | "rain" | "wind" | "noise"
            this.volume = 0.75;
            this.muted = false;
            this.chimeEnabled = true;
            this.buffers = {};
            this.activeNodes = null;
          }

          async ensureContext() {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return null;
              this.ctx = new AudioCtx();

              this.compressor = this.ctx.createDynamicsCompressor();
              this.compressor.threshold.setValueAtTime(-16, this.ctx.currentTime);
              this.compressor.knee.setValueAtTime(18, this.ctx.currentTime);
              this.compressor.ratio.setValueAtTime(4, this.ctx.currentTime);
              this.compressor.attack.setValueAtTime(0.005, this.ctx.currentTime);
              this.compressor.release.setValueAtTime(0.15, this.ctx.currentTime);

              this.masterGain = this.ctx.createGain();
              this.masterGain.gain.setValueAtTime(
                this.muted ? 0 : this.volume,
                this.ctx.currentTime
              );

              this.compressor.connect(this.masterGain);
              this.masterGain.connect(this.ctx.destination);
              this._initBuffers();
            }

            if (this.ctx.state === "suspended") {
              try {
                await this.ctx.resume();
              } catch {}
            }
            return this.ctx;
          }

          _normalizeBuffer(data) {
            let maxAbs = 0;
            for (let i = 0; i < data.length; i++) {
              const a = Math.abs(data[i]);
              if (a > maxAbs) maxAbs = a;
            }
            const scale = maxAbs > 0 ? 0.9 / maxAbs : 1;
            for (let i = 0; i < data.length; i++) {
              data[i] *= scale;
            }
            // Seamless 2048-sample wrap crossfade to avoid loop click
            const fade = Math.min(2048, Math.floor(data.length / 8));
            for (let i = 0; i < fade; i++) {
              const w = i / fade;
              data[i] = data[i] * w + data[data.length - fade + i] * (1 - w);
            }
          }

          _initBuffers() {
            const sr = this.ctx.sampleRate;
            const len = sr * 4;

            // Normalized Brown Noise (Wind)
            const brownBuf = this.ctx.createBuffer(1, len, sr);
            const brownOut = brownBuf.getChannelData(0);
            let lastOut = 0;
            for (let i = 0; i < len; i++) {
              const white = Math.random() * 2 - 1;
              lastOut = (lastOut + 0.03 * white) / 1.03;
              brownOut[i] = lastOut;
            }
            this._normalizeBuffer(brownOut);
            this.buffers.brown = brownBuf;

            // Normalized Pink Noise (Rain / Soft Noise)
            const pinkBuf = this.ctx.createBuffer(1, len, sr);
            const pinkOut = pinkBuf.getChannelData(0);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < len; i++) {
              const white = Math.random() * 2 - 1;
              b0 = 0.99886 * b0 + white * 0.0555179;
              b1 = 0.99332 * b1 + white * 0.0750759;
              b2 = 0.96900 * b2 + white * 0.1538520;
              b3 = 0.86650 * b3 + white * 0.3104856;
              b4 = 0.55000 * b4 + white * 0.5329522;
              b5 = -0.7616 * b5 - white * 0.0168980;
              pinkOut[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
              b6 = white * 0.115926;
            }
            this._normalizeBuffer(pinkOut);
            this.buffers.pink = pinkBuf;
          }

          _stopActiveNodes(immediate = false) {
            if (!this.activeNodes || !this.ctx) return;
            const nodes = this.activeNodes;
            this.activeNodes = null;
            const now = this.ctx.currentTime;
            try {
              nodes.gain.gain.setTargetAtTime(0.0001, now, 0.04);
            } catch {}
            const delay = immediate ? 0 : 180;
            setTimeout(() => {
              nodes.stoppables.forEach((s) => {
                try {
                  s.stop();
                } catch {}
              });
              nodes.cleanup.forEach((n) => {
                try {
                  n.disconnect();
                } catch {}
              });
            }, delay);
          }

          async setMode(nextMode) {
            this.mode = nextMode;
            if (nextMode === "off") {
              this._stopActiveNodes();
              return;
            }
            const ctx = await this.ensureContext();
            if (!ctx) return;

            this._stopActiveNodes(true);
            const now = ctx.currentTime;
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.0001, now);
            gain.connect(this.compressor);

            if (nextMode === "rain") {
              const src = ctx.createBufferSource();
              src.buffer = this.buffers.pink;
              src.loop = true;

              const bp = ctx.createBiquadFilter();
              bp.type = "bandpass";
              bp.frequency.setValueAtTime(1100, now);
              bp.Q.setValueAtTime(0.5, now);

              const lp = ctx.createBiquadFilter();
              lp.type = "lowpass";
              lp.frequency.setValueAtTime(4200, now);

              src.connect(bp);
              bp.connect(lp);
              lp.connect(gain);
              src.start(now);
              gain.gain.setTargetAtTime(0.55, now, 0.12);
              this.activeNodes = { gain, stoppables: [src], cleanup: [src, bp, lp, gain] };
            } else if (nextMode === "wind") {
              const src = ctx.createBufferSource();
              src.buffer = this.buffers.brown;
              src.loop = true;

              const lp = ctx.createBiquadFilter();
              lp.type = "lowpass";
              lp.frequency.setValueAtTime(360, now);
              lp.Q.setValueAtTime(1.4, now);

              const lfo = ctx.createOscillator();
              lfo.frequency.setValueAtTime(0.12, now);
              const lfoGain = ctx.createGain();
              lfoGain.gain.setValueAtTime(120, now);
              lfo.connect(lfoGain);
              lfoGain.connect(lp.frequency);

              src.connect(lp);
              lp.connect(gain);
              src.start(now);
              lfo.start(now);
              gain.gain.setTargetAtTime(0.65, now, 0.14);
              this.activeNodes = {
                gain,
                stoppables: [src, lfo],
                cleanup: [src, lp, lfo, lfoGain, gain],
              };
            } else if (nextMode === "noise") {
              const src = ctx.createBufferSource();
              src.buffer = this.buffers.pink;
              src.loop = true;

              const lp = ctx.createBiquadFilter();
              lp.type = "lowpass";
              lp.frequency.setValueAtTime(750, now);
              lp.Q.setValueAtTime(0.7, now);

              src.connect(lp);
              lp.connect(gain);
              src.start(now);
              gain.gain.setTargetAtTime(0.45, now, 0.12);
              this.activeNodes = { gain, stoppables: [src], cleanup: [src, lp, gain] };
            }
          }

          setVolume(norm) {
            this.volume = Math.max(0, Math.min(1, norm));
            if (this.ctx && this.masterGain) {
              const target = this.muted ? 0 : this.volume;
              this.masterGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.04);
            }
          }

          toggleMute() {
            this.muted = !this.muted;
            if (this.ctx && this.masterGain) {
              const target = this.muted ? 0 : this.volume;
              this.masterGain.gain.setTargetAtTime(target, this.ctx.currentTime, 0.04);
            }
            return this.muted;
          }

          async playChime(force = false) {
            if (!force && (!this.chimeEnabled || this.muted)) return;
            const ctx = await this.ensureContext();
            if (!ctx) return;

            const now = ctx.currentTime;
            const notes = [
              { freq: 523.25, t: 0.01, amp: 0.45 }, // C5
              { freq: 1046.5, t: 0.01, amp: 0.22 }, // C6
              { freq: 1567.98, t: 0.01, amp: 0.10 }, // G6
              { freq: 783.99, t: 0.29, amp: 0.42 }, // G5
              { freq: 1174.66, t: 0.29, amp: 0.20 }, // D6
            ];

            notes.forEach((n) => {
              const start = now + n.t;
              const osc = ctx.createOscillator();
              const g = ctx.createGain();
              osc.type = "sine";
              osc.frequency.setValueAtTime(n.freq, start);

              g.gain.setValueAtTime(0.0001, start);
              g.gain.linearRampToValueAtTime(n.amp, start + 0.01);
              g.gain.exponentialRampToValueAtTime(0.0001, start + 2.4);

              osc.connect(g);
              g.connect(this.compressor);
              osc.start(start);
              osc.stop(start + 2.45);
            });
          }
        }

        const sound = new SoundEngine();

        /* ========== STATE & STORAGE (BACKWARD COMPATIBLE) ========== */
        const state = {
          mode: "focus",
          running: false,
          totalMs: 25 * 60 * 1000,
          remainingMs: 25 * 60 * 1000,
          endTimeMs: 0,
          focusCycles: 0,
          currentTask: "",

          sessionCount: 0,
          totalMinutes: 0,
          totalBreakMinutes: 0,
          streakCount: 0,
          maxStreak: 0,
          sessionHistory: [],
        };

        function loadState() {
          try {
            state.sessionCount = clampInt(localStorage.getItem("pomodoro_sessionCount"), 0, 1e6, 0);
            state.totalMinutes = clampInt(localStorage.getItem("pomodoro_totalMinutes"), 0, 1e7, 0);
            state.totalBreakMinutes = clampInt(localStorage.getItem("pomodoro_totalBreakMinutes"), 0, 1e7, 0);
            state.streakCount = clampInt(localStorage.getItem("pomodoro_streakCount"), 0, 1e5, 0);
            state.maxStreak = clampInt(localStorage.getItem("pomodoro_maxStreak"), 0, 1e5, 0);
            state.currentTask = sanitizeText(localStorage.getItem("pomodoro_currentTask") || "", 64);

            const rawHist = safeJsonParse(localStorage.getItem("pomodoro_history"), []);
            if (Array.isArray(rawHist)) {
              state.sessionHistory = rawHist
                .filter((x) => x && x.timestamp && Number.isFinite(Number(x.duration)))
                .slice(-500)
                .map((x) => {
                  const dt = new Date(x.timestamp);
                  return Number.isNaN(dt.getTime())
                    ? null
                    : {
                        timestamp: dt.toISOString(),
                        duration: clampInt(x.duration, 1, 300, 25),
                        type: x.type === "break" ? "break" : "focus",
                      };
                })
                .filter(Boolean);
            }

            const savedSound = safeJsonParse(localStorage.getItem("pomodoro_sound"), null);
            if (savedSound && typeof savedSound === "object") {
              sound.volume = Math.max(0, Math.min(1, Number(savedSound.volume ?? 0.75)));
              sound.chimeEnabled = savedSound.chime !== undefined ? Boolean(savedSound.chime) : true;
            }
          } catch {}
        }

        function saveStats() {
          try {
            localStorage.setItem("pomodoro_sessionCount", String(state.sessionCount));
            localStorage.setItem("pomodoro_totalMinutes", String(state.totalMinutes));
            localStorage.setItem("pomodoro_totalBreakMinutes", String(state.totalBreakMinutes));
            localStorage.setItem("pomodoro_streakCount", String(state.streakCount));
            localStorage.setItem("pomodoro_maxStreak", String(state.maxStreak));
            localStorage.setItem("pomodoro_history", JSON.stringify(state.sessionHistory));
          } catch {}
        }

        function saveSoundPrefs() {
          try {
            localStorage.setItem(
              "pomodoro_sound",
              JSON.stringify({ volume: sound.volume, chime: sound.chimeEnabled })
            );
          } catch {}
        }

        /* ========== SINGLE-SLOT NON-STACKING TOAST ========== */
        let toastTimer = null;
        function showToast(msg) {
          const el = $("toast");
          el.textContent = msg;
          el.classList.add("visible");
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(() => {
            el.classList.remove("visible");
            toastTimer = null;
          }, 1800);
        }

        /* ========== WAKE LOCK ========== */
        let wakeLockSentinel = null;
        async function syncWakeLock() {
          if (!("wakeLock" in navigator)) return;
          if (state.running || document.fullscreenElement) {
            if (!wakeLockSentinel) {
              try {
                wakeLockSentinel = await navigator.wakeLock.request("screen");
                wakeLockSentinel.addEventListener("release", () => {
                  wakeLockSentinel = null;
                });
              } catch {}
            }
          } else if (wakeLockSentinel) {
            try {
              await wakeLockSentinel.release();
            } catch {}
            wakeLockSentinel = null;
          }
        }

        /* ========== ZERO-DRIFT WORKER + 90-120 FPS RING SWEEP ========== */
        let worker = null;
        let fallbackInterval = null;
        let lastDisplayedSec = -1;

        function initWorker() {
          try {
            const code =
              "let t=null;self.onmessage=e=>{if(e.data==='start'){if(!t)t=setInterval(()=>self.postMessage('t'),200);}else{clearInterval(t);t=null;}};";
            const blob = new Blob([code], { type: "application/javascript" });
            worker = new Worker(URL.createObjectURL(blob));
            worker.onmessage = onTick;
          } catch {
            worker = null;
          }
        }

        function startTicker() {
          if (worker) worker.postMessage("start");
          else if (!fallbackInterval) fallbackInterval = setInterval(onTick, 200);
        }

        function stopTicker() {
          if (worker) worker.postMessage("stop");
          if (fallbackInterval) {
            clearInterval(fallbackInterval);
            fallbackInterval = null;
          }
        }

        const chronoArc = $("chronoArc");
        const chronoTip = $("chronoTip");
        chronoArc.style.strokeDasharray = String(RING_CIRC);

        function drawRing(ratio) {
          const clamped = Math.max(0, Math.min(1, ratio));
          chronoArc.style.strokeDashoffset = (RING_CIRC * (1 - clamped)).toFixed(2);
          const angle = clamped * Math.PI * 2 - Math.PI / 2;
          chronoTip.setAttribute("cx", (180 + RING_RADIUS * Math.cos(angle)).toFixed(2));
          chronoTip.setAttribute("cy", (180 + RING_RADIUS * Math.sin(angle)).toFixed(2));
          chronoTip.style.opacity = clamped <= 0.002 ? "0" : "1";
        }

        function sweepLoop() {
          if (state.running) {
            const rem = Math.max(0, state.endTimeMs - Date.now());
            drawRing(state.totalMs > 0 ? rem / state.totalMs : 0);
            requestAnimationFrame(sweepLoop);
          }
        }

        function onTick() {
          if (!state.running) return;
          state.remainingMs = Math.max(0, state.endTimeMs - Date.now());
          const sec = Math.ceil(state.remainingMs / 1000);
          if (sec !== lastDisplayedSec) {
            lastDisplayedSec = sec;
            $("timerDisplay").textContent = formatMMSS(state.remainingMs);
            updateTitle();
          }
          if (state.remainingMs <= 0) {
            completePhase();
          }
        }

        /* ========== TIMER CONTROLS & UI SYNC ========== */
        function updateTitle() {
          const timeStr = formatMMSS(state.remainingMs);
          const tag = state.mode === "focus" ? "Focus" : state.mode === "short" ? "Short Break" : "Long Break";
          document.title = state.running ? `${timeStr} · ${tag}` : "Pomodoro";
        }

        function updateTimerUI() {
          document.body.classList.toggle("is-running", state.running);
          $("timerDisplay").textContent = formatMMSS(state.remainingMs);
          drawRing(state.totalMs > 0 ? state.remainingMs / state.totalMs : 1);

          $("startLabel").textContent = state.running
            ? "Pause"
            : state.remainingMs < state.totalMs
              ? "Resume"
              : "Start";

          $("startIcon").innerHTML = state.running
            ? '<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>'
            : '<polygon points="6 4 20 12 6 20 6 4"/>';

          if (state.running) {
            const eta = new Date(state.endTimeMs).toLocaleTimeString([], {
              hour: "2-digit",
              minute: "2-digit",
              hour12: false,
            });
            $("etaLine").textContent = `Ends ${eta}`;
          }

          updateTitle();
        }

        function highlightPreset(mins) {
          document.querySelectorAll(".preset-btn[data-min]").forEach((btn) => {
            btn.classList.toggle("active", state.mode === "focus" && Number(btn.dataset.min) === mins);
          });
        }

        function setMode(mode) {
          stopTimer();
          state.mode = mode;
          const idx = mode === "focus" ? 0 : mode === "short" ? 1 : 2;
          $("modeSwitch").style.setProperty("--seg-idx", String(idx));

          document.querySelectorAll(".mode-btn").forEach((b) => {
            const active = b.dataset.mode === mode;
            b.classList.toggle("active", active);
            b.setAttribute("aria-selected", String(active));
          });

          const mins = MODE_MINS[mode];
          state.totalMs = mins * 60 * 1000;
          state.remainingMs = state.totalMs;
          highlightPreset(mins);
          updateTimerUI();
        }

        function setDuration(mins) {
          const m = clampInt(mins, 1, 180, 25);
          stopTimer();
          state.totalMs = m * 60 * 1000;
          state.remainingMs = state.totalMs;
          highlightPreset(m);
          updateTimerUI();
        }

        function startOrPause() {
          sound.ensureContext();
          if (state.running) {
            state.remainingMs = Math.max(0, state.endTimeMs - Date.now());
            stopTimer();
            return;
          }
          if (state.remainingMs <= 0) state.remainingMs = state.totalMs;
          state.running = true;
          state.endTimeMs = Date.now() + state.remainingMs;
          lastDisplayedSec = Math.ceil(state.remainingMs / 1000);
          startTicker();
          updateTimerUI();
          syncWakeLock();
          requestAnimationFrame(sweepLoop);
        }

        function stopTimer() {
          state.running = false;
          stopTicker();
          updateTimerUI();
          syncWakeLock();
        }

        function resetTimer() {
          stopTimer();
          state.remainingMs = state.totalMs;
          updateTimerUI();
        }

        function completePhase() {
          stopTimer();
          state.remainingMs = 0;
          drawRing(0);
          sound.playChime(false);

          const mins = Math.max(1, Math.round(state.totalMs / 60000));
          if (state.mode === "focus") {
            state.sessionCount += 1;
            state.totalMinutes += mins;
            state.streakCount += 1;
            if (state.streakCount > state.maxStreak) state.maxStreak = state.streakCount;
            state.focusCycles += 1;
            state.sessionHistory.push({
              timestamp: new Date().toISOString(),
              duration: mins,
              type: "focus",
            });
            saveStats();
            renderStats();

            const next = state.focusCycles % 4 === 0 ? "long" : "short";
            setMode(next);
            showToast(`Focus complete (+${mins}m)`);
          } else {
            state.totalBreakMinutes += mins;
            state.sessionHistory.push({
              timestamp: new Date().toISOString(),
              duration: mins,
              type: "break",
            });
            saveStats();
            renderStats();
            setMode("focus");
            showToast("Break finished");
          }
        }

        function skipPhase() {
          stopTimer();
          if (state.mode === "focus") {
            const next = (state.focusCycles + 1) % 4 === 0 ? "long" : "short";
            setMode(next);
          } else {
            setMode("focus");
          }
        }

        /* ========== STATS & SOUND POPOVER UI ========== */
        function renderStats() {
          const todayKey = getDayKey(new Date());
          let todaySessions = 0;
          let todayMin = 0;
          for (let i = 0; i < state.sessionHistory.length; i++) {
            const s = state.sessionHistory[i];
            if (s.type === "focus" && getDayKey(s.timestamp) === todayKey) {
              todaySessions += 1;
              todayMin += s.duration;
            }
          }
          $("statTodaySessions").textContent = String(todaySessions);
          $("statTodayMin").textContent = `${todayMin}m`;
          $("statTotalSessions").textContent = String(state.sessionCount);
          $("statTotalHrs").textContent = `${(state.totalMinutes / 60).toFixed(1)}h`;
          $("streakSub").textContent = `${state.streakCount} streak`;
        }

        function updateSoundUI() {
          const names = { off: "Off", rain: "Rain", wind: "Wind", noise: "Soft Noise" };
          $("soundStatusText").textContent = sound.muted ? "Muted" : names[sound.mode];
          $("volLabel").textContent = `${Math.round(sound.volume * 100)}%`;
          $("volumeSlider").value = String(Math.round(sound.volume * 100));
          $("chimeSwitch").setAttribute("aria-checked", String(sound.chimeEnabled));

          document.querySelectorAll(".sound-opt").forEach((btn) => {
            btn.classList.toggle("active", btn.dataset.sound === sound.mode);
          });

          const isSoundPlaying = !sound.muted && sound.mode !== "off";
          $("soundBtn").classList.toggle("is-active", isSoundPlaying);
          $("soundBtnIcon").innerHTML = sound.muted
            ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>'
            : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
        }

        function closePopovers() {
          $("soundPopover").classList.remove("open");
          $("statsPopover").classList.remove("open");
          $("soundBtn").setAttribute("aria-expanded", "false");
          $("statsBtn").setAttribute("aria-expanded", "false");
          document.body.classList.remove("popover-open");
        }

        function togglePopover(popId, btnId) {
          const pop = $(popId);
          const isOpen = pop.classList.contains("open");
          closePopovers();
          if (!isOpen) {
            if (popId === "statsPopover") renderStats();
            pop.classList.add("open");
            $(btnId).setAttribute("aria-expanded", "true");
            document.body.classList.add("popover-open");
          }
        }

        function toggleFullscreen() {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.().catch(() => {});
          } else {
            document.exitFullscreen?.().catch(() => {});
          }
        }

        function updateFullscreenUI() {
          const isFs = Boolean(document.fullscreenElement);
          $("fullscreenBtn").classList.toggle("is-active", isFs);
          $("fullscreenIcon").innerHTML = isFs
            ? '<path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>'
            : '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
          syncWakeLock();
        }

        function updateClock() {
          $("liveClock").textContent = new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          });
        }

        /* ========== EVENTS ========== */
        function bindEvents() {
          $("startBtn").addEventListener("click", startOrPause);
          $("resetBtn").addEventListener("click", resetTimer);
          $("skipBtn").addEventListener("click", skipPhase);

          document.querySelectorAll(".mode-btn").forEach((btn) => {
            btn.addEventListener("click", () => setMode(btn.dataset.mode));
          });

          document.querySelectorAll(".preset-btn[data-min]").forEach((btn) => {
            btn.addEventListener("click", () => {
              if (state.mode !== "focus") setMode("focus");
              setDuration(btn.dataset.min);
            });
          });

          $("customForm").addEventListener("submit", (e) => {
            e.preventDefault();
            const raw = $("customInput").value;
            if (!raw) return;
            const mins = clampInt(raw, 1, 180, 25);
            setDuration(mins);
            $("customInput").value = "";
            showToast(`Timer set to ${mins}m`);
          });

          $("taskInput").addEventListener("input", (e) => {
            state.currentTask = sanitizeText(e.target.value, 64);
            try {
              localStorage.setItem("pomodoro_currentTask", state.currentTask);
            } catch {}
          });

          $("taskInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === "Escape") {
              e.preventDefault();
              e.target.blur();
            }
          });

          // Popovers & Header
          $("soundBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            togglePopover("soundPopover", "soundBtn");
          });
          $("statsBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            togglePopover("statsPopover", "statsBtn");
          });
          $("fullscreenBtn").addEventListener("click", toggleFullscreen);

          document.addEventListener("click", (e) => {
            if (
              !e.target.closest(".popover") &&
              !e.target.closest("#soundBtn") &&
              !e.target.closest("#statsBtn")
            ) {
              closePopovers();
            }
          });

          // Sound Popover Controls
          document.querySelectorAll(".sound-opt").forEach((btn) => {
            btn.addEventListener("click", async () => {
              if (sound.muted) sound.toggleMute();
              await sound.setMode(btn.dataset.sound);
              updateSoundUI();
            });
          });

          $("volumeSlider").addEventListener("input", async (e) => {
            const v = Number(e.target.value) / 100;
            sound.setVolume(v);
            if (sound.muted && v > 0) sound.toggleMute();
            if (sound.mode === "off" && v > 0) {
              await sound.setMode("rain");
            }
            saveSoundPrefs();
            updateSoundUI();
          });

          $("chimeSwitch").addEventListener("click", () => {
            sound.chimeEnabled = !sound.chimeEnabled;
            saveSoundPrefs();
            updateSoundUI();
          });

          $("testChimeBtn").addEventListener("click", async () => {
            if (sound.muted) {
              sound.toggleMute();
              updateSoundUI();
            }
            await sound.playChime(true);
          });

          // Stats Reset (2-step safe confirm)
          let resetArmed = false;
          let resetArmTimer = null;
          $("resetStatsBtn").addEventListener("click", () => {
            const btn = $("resetStatsBtn");
            if (!resetArmed) {
              resetArmed = true;
              btn.textContent = "Click again to confirm";
              btn.classList.add("confirm-danger");
              resetArmTimer = setTimeout(() => {
                resetArmed = false;
                btn.textContent = "Reset Stats";
                btn.classList.remove("confirm-danger");
              }, 3000);
              return;
            }
            clearTimeout(resetArmTimer);
            resetArmed = false;
            btn.textContent = "Reset Stats";
            btn.classList.remove("confirm-danger");

            state.sessionCount = 0;
            state.totalMinutes = 0;
            state.totalBreakMinutes = 0;
            state.streakCount = 0;
            state.maxStreak = 0;
            state.sessionHistory = [];
            saveStats();
            renderStats();
            showToast("Stats reset");
          });

          // Keyboard Shortcuts
          document.addEventListener("keydown", (e) => {
            const tag = e.target?.tagName;
            if (tag === "INPUT" || tag === "TEXTAREA" || e.target?.isContentEditable) {
              if (e.key === "Escape") e.target.blur();
              return;
            }

            if (e.key === "Escape") {
              closePopovers();
              return;
            }
            if (e.code === "Space") {
              e.preventDefault();
              startOrPause();
            } else if (e.key === "r" || e.key === "R") {
              e.preventDefault();
              resetTimer();
            } else if (e.key === "s" || e.key === "S") {
              e.preventDefault();
              skipPhase();
            } else if (e.key === "m" || e.key === "M") {
              e.preventDefault();
              sound.toggleMute();
              updateSoundUI();
            } else if (e.key === "f" || e.key === "F") {
              e.preventDefault();
              toggleFullscreen();
            } else if (e.key === "1") {
              setMode("focus");
            } else if (e.key === "2") {
              setMode("short");
            } else if (e.key === "3") {
              setMode("long");
            }
          });

          document.addEventListener("fullscreenchange", updateFullscreenUI);
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden && state.running) {
              onTick();
              syncWakeLock();
              requestAnimationFrame(sweepLoop);
            }
          });
        }

        /* ========== INIT ========== */
        function init() {
          loadState();
          $("taskInput").value = state.currentTask;
          initWorker();
          bindEvents();
          updateTimerUI();
          updateSoundUI();
          renderStats();
          updateClock();
          setInterval(updateClock, 1000);
        }

        init();
      })();
    </script>
  </body>
</html>
