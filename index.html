      // ========== FLEX EXPORT (Canvas 2D Version) ==========
      function drawRoundRect(ctx, x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let lines = [];
        for (let n = 0; n < words.length; n++) {
          let testLine = line + words[n] + ' ';
          let testWidth = ctx.measureText(testLine).width;
          if (testWidth > maxWidth && n > 0) {
            lines.push(line);
            line = words[n] + ' ';
          } else {
            line = testLine;
          }
        }
        lines.push(line);
        for (let i = 0; i < lines.length; i++) {
          ctx.fillText(lines[i], x, y + (i * lineHeight));
        }
        return lines.length * lineHeight;
      }

      async function exportFlex(ratio) {
        showToast("info", "Rendering...", "Generating peak flex image! 📸");
        
        // Wait for fonts to be ready so canvas draws proper typography
        await document.fonts.ready;

        const totalOverallTime = totalMinutes + totalBreakMinutes;
        const focusPct = totalOverallTime === 0 ? 100 : Math.round((totalMinutes / totalOverallTime) * 100);
        const avgSession = sessionCount > 0 ? Math.round(totalMinutes / sessionCount) : 0;
        const prodScore = Math.min(100, Math.round((totalMinutes / 180) * 100));

        const quotes = currentTheme === "male"
            ? [
                "Cày sâu cuốc bẫm, ngày sau gáy to! 💎",
                "Hôm nay chạy code, ngày mai chạy Mẹc! 🚀",
                "Kỷ luật thép tạo nên kim cương! ⚡",
              ]
            : [
                "Xinh đẹp và giỏi giang, tớ có cả hai! 💕",
                "Mỗi phút trôi qua đều tỏa sáng! ✨",
                "Sự tập trung làm nên thần thái! 🌸",
              ];
        const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
        const dateOptions = { month: "short", day: "numeric", year: "numeric" };
        const dateStr = sessionStartTime.toLocaleDateString("en-US", dateOptions).toUpperCase();

        const canvas = document.createElement('canvas');
        let width = ratio === '9:16' ? 1080 : 1600;
        let height = ratio === '9:16' ? 1920 : 900;
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        if (ratio !== '9:16') {
          // ================= DRAW 16:9 LANDSCAPE =================
          // 1. Draw Background Gradient
          const bgGrad = ctx.createLinearGradient(0, 0, width, height);
          bgGrad.addColorStop(0, '#09090b');
          bgGrad.addColorStop(0.5, '#111119');
          bgGrad.addColorStop(1, '#0c0714');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, width, height);

          // 2. Draw Glow Orbs
          // Left Top Pink Orb
          let pGlow = ctx.createRadialGradient(200, 200, 50, 200, 200, 500);
          pGlow.addColorStop(0, 'rgba(255, 46, 147, 0.15)');
          pGlow.addColorStop(1, 'rgba(255, 46, 147, 0)');
          ctx.fillStyle = pGlow;
          ctx.beginPath();
          ctx.arc(200, 200, 500, 0, Math.PI * 2);
          ctx.fill();

          // Right Bottom Orange Orb
          let oGlow = ctx.createRadialGradient(width - 200, height - 200, 50, width - 200, height - 200, 500);
          oGlow.addColorStop(0, 'rgba(255, 128, 0, 0.12)');
          oGlow.addColorStop(1, 'rgba(255, 128, 0, 0)');
          ctx.fillStyle = oGlow;
          ctx.beginPath();
          ctx.arc(width - 200, height - 200, 500, 0, Math.PI * 2);
          ctx.fill();

          // 3. Draw Main Card (Bo góc, Glassmorphism)
          ctx.save();
          ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
          ctx.lineWidth = 2;
          drawRoundRect(ctx, 80, 60, width - 160, height - 120, 36, true, true);
          ctx.restore();

          // 4. Header Text
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 48px "Space Mono", "DM Sans", sans-serif';
          ctx.fillText('FOCUS REPORT', 140, 140);

          ctx.fillStyle = '#a1a1aa';
          ctx.font = '700 20px "Space Mono", monospace';
          ctx.fillText(`${dateStr} SESSION`, 140, 185);

          ctx.font = '900 42px "DM Sans", sans-serif';
          ctx.fillText('⏱️', width - 200, 145);

          // 5. Draw KPI Cards (4 cards)
          const kpis = [
            { label: 'TOTAL FOCUS', value: `${totalMinutes}`, unit: 'min' },
            { label: 'SESSIONS', value: `${sessionCount}`, unit: '' },
            { label: 'MAX STREAK', value: `${maxStreak}`, unit: '🔥' },
            { label: 'AVG SESSION', value: `${avgSession}`, unit: 'min' }
          ];

          const startX = 140;
          const kpiW = (width - 340 - 90) / 4; // 4 cards with 30px gap
          const kpiH = 150;
          const kpiY = 230;

          kpis.forEach((kpi, idx) => {
            const x = startX + idx * (kpiW + 30);
            // Draw KPI border & fill
            ctx.save();
            if (idx === 2) {
              // Highlight Streak card
              ctx.fillStyle = 'rgba(255, 46, 147, 0.08)';
              ctx.strokeStyle = 'rgba(255, 46, 147, 0.3)';
            } else {
              ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            }
            ctx.lineWidth = 1.5;
            drawRoundRect(ctx, x, kpiY, kpiW, kpiH, 20, true, true);
            ctx.restore();

            // Labels
            ctx.fillStyle = '#a1a1aa';
            ctx.font = '700 14px "Space Mono", "DM Sans", sans-serif';
            ctx.fillText(kpi.label, x + 25, kpiY + 45);

            // Values
            ctx.fillStyle = idx === 2 ? '#ff2e93' : '#ffffff';
            ctx.font = '900 38px "Space Mono", monospace';
            ctx.fillText(kpi.value, x + 25, kpiY + 105);

            if (kpi.unit) {
              ctx.fillStyle = idx === 2 ? 'rgba(255, 46, 147, 0.7)' : '#a1a1aa';
              ctx.font = '500 16px "DM Sans", sans-serif';
              ctx.fillText(kpi.unit, x + 25 + ctx.measureText(kpi.value).width + 8, kpiY + 100);
            }
          });

          // 6. Draw Wave Chart (Left bottom)
          const chartX = 140;
          const chartY = 430;
          const chartW = 600;
          const chartH = 260;

          ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
          drawRoundRect(ctx, chartX, chartY, chartW, chartH, 24, true, true);

          ctx.fillStyle = '#ffffff';
          ctx.font = '800 18px "DM Sans", sans-serif';
          ctx.fillText('ACTIVITY WAVE', chartX + 30, chartY + 45);

          // Draw spline
          const focusSessions = sessionHistory.filter(s => s.type === "focus");
          if (focusSessions.length > 0) {
            const maxDuration = Math.max(...focusSessions.map(s => s.duration), 1);
            const graphW = chartW - 80;
            const graphH = chartH - 110;
            const graphX = chartX + 40;
            const graphY = chartY + 80;
            const stepX = focusSessions.length > 1 ? graphW / (focusSessions.length - 1) : graphW;

            ctx.save();
            // Create Gradient for Line
            const lineGrad = ctx.createLinearGradient(graphX, 0, graphX + graphW, 0);
            lineGrad.addColorStop(0, '#FF2E93');
            lineGrad.addColorStop(1, '#FF8000');

            // Draw area gradient under curve
            const areaGrad = ctx.createLinearGradient(0, graphY, 0, graphY + graphH);
            areaGrad.addColorStop(0, 'rgba(255, 46, 147, 0.3)');
            areaGrad.addColorStop(1, 'rgba(255, 128, 0, 0)');

            ctx.beginPath();
            ctx.moveTo(graphX, graphY + graphH);
            focusSessions.forEach((s, i) => {
              const x = graphX + (focusSessions.length === 1 ? graphW / 2 : i * stepX);
              const y = graphY + graphH - (s.duration / maxDuration) * graphH;
              ctx.lineTo(x, y);
            });
            ctx.lineTo(graphX + (focusSessions.length === 1 ? graphW / 2 : (focusSessions.length - 1) * stepX), graphY + graphH);
            ctx.closePath();
            ctx.fillStyle = areaGrad;
            ctx.fill();

            // Draw line
            ctx.beginPath();
            focusSessions.forEach((s, i) => {
              const x = graphX + (focusSessions.length === 1 ? graphW / 2 : i * stepX);
              const y = graphY + graphH - (s.duration / maxDuration) * graphH;
              if (i === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            });
            ctx.strokeStyle = lineGrad;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Draw Points
            focusSessions.forEach((s, i) => {
              const x = graphX + (focusSessions.length === 1 ? graphW / 2 : i * stepX);
              const y = graphY + graphH - (s.duration / maxDuration) * graphH;
              ctx.beginPath();
              ctx.arc(x, y, 5, 0, Math.PI * 2);
              ctx.fillStyle = '#ffffff';
              ctx.fill();
              ctx.strokeStyle = '#FF2E93';
              ctx.lineWidth = 2.5;
              ctx.stroke();
            });
            ctx.restore();
          } else {
            ctx.fillStyle = '#a1a1aa';
            ctx.font = '500 16px "DM Sans", sans-serif';
            ctx.fillText('No focus session data yet.', chartX + 40, chartY + 130);
          }

          // 7. Draw Donut Chart (Right bottom)
          const donutX = 800;
          const donutY = 430;
          const donutW = width - 140 - donutX;
          const donutH = 260;

          ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
          drawRoundRect(ctx, donutX, donutY, donutW, donutH, 24, true, true);

          ctx.fillStyle = '#ffffff';
          ctx.font = '800 18px "DM Sans", sans-serif';
          ctx.fillText('FOCUS VS BREAK', donutX + 30, donutY + 45);

          // Draw Donut
          const cx = donutX + donutW / 2;
          const cy = donutY + donutH / 2 + 10;
          const r = 60;
          
          // Background ring
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
          ctx.lineWidth = 14;
          ctx.stroke();

          // Progress ring
          ctx.save();
          const angle = (focusPct / 100) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(cx, cy, r, -Math.PI / 2, angle - Math.PI / 2);
          const donutGrad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
          donutGrad.addColorStop(0, '#FF2E93');
          donutGrad.addColorStop(1, '#FF8000');
          ctx.strokeStyle = donutGrad;
          ctx.lineWidth = 14;
          ctx.lineCap = 'round';
          ctx.stroke();
          ctx.restore();

          // Text in center
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 24px "Space Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`${focusPct}%`, cx, cy + 8);
          ctx.restore(); // reset textAlign

          // 8. Footer Info & Watermark
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.font = '700 14px "Space Mono", monospace';
          ctx.fillText(`GRINDER: ${userName.toUpperCase()}`, 140, 755);

          ctx.fillStyle = 'rgba(255, 46, 147, 0.8)';
          ctx.font = 'italic 16px "DM Sans", sans-serif';
          ctx.fillText(`"${randomQuote}"`, 140, 790);

          // (Moshi text moved to end for glitch effect)
        } else {
          // ================= DRAW 9:16 PORTRAIT (STORY) =================
          // 1. Draw Background Gradient
          const bgGrad = ctx.createLinearGradient(0, 0, 0, height);
          bgGrad.addColorStop(0, '#050508');
          bgGrad.addColorStop(0.5, '#120d1a');
          bgGrad.addColorStop(1, '#07040a');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, width, height);

          // 2. Draw Glow Orbs
          // Top Pink Glow
          let topGlow = ctx.createRadialGradient(width/2, 200, 50, width/2, 200, 450);
          topGlow.addColorStop(0, 'rgba(255, 46, 147, 0.12)');
          topGlow.addColorStop(1, 'rgba(255, 46, 147, 0)');
          ctx.fillStyle = topGlow;
          ctx.beginPath();
          ctx.arc(width/2, 200, 450, 0, Math.PI * 2);
          ctx.fill();

          // Bottom Orange Glow
          let botGlow = ctx.createRadialGradient(width/2, height - 300, 50, width/2, height - 300, 500);
          botGlow.addColorStop(0, 'rgba(255, 128, 0, 0.15)');
          botGlow.addColorStop(1, 'rgba(255, 128, 0, 0)');
          ctx.fillStyle = botGlow;
          ctx.beginPath();
          ctx.arc(width/2, height - 300, 500, 0, Math.PI * 2);
          ctx.fill();

          // 3. Draw Main Card (Glassmorphism)
          ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
          ctx.lineWidth = 2.5;
          drawRoundRect(ctx, 70, 100, width - 140, height - 200, 48, true, true);

          // 4. Header
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 48px "Space Mono", "DM Sans", sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('DAILY FOCUS', width / 2, 200);

          ctx.fillStyle = '#a1a1aa';
          ctx.font = '700 22px "Space Mono", monospace';
          ctx.fillText(dateStr, width / 2, 250);

          // 5. Giant STREAK Badge (Center of Story)
          const badgeY = 600;
          ctx.save();
          // Draw Glowing Circle for Badge
          let badgeGlow = ctx.createRadialGradient(width/2, badgeY, 80, width/2, badgeY, 200);
          badgeGlow.addColorStop(0, 'rgba(255, 46, 147, 0.2)');
          badgeGlow.addColorStop(1, 'rgba(255, 46, 147, 0)');
          ctx.fillStyle = badgeGlow;
          ctx.beginPath();
          ctx.arc(width/2, badgeY, 200, 0, Math.PI * 2);
          ctx.fill();

          // Ring
          ctx.beginPath();
          ctx.arc(width/2, badgeY, 150, 0, Math.PI * 2);
          const badgeGrad = ctx.createLinearGradient(width/2 - 150, badgeY - 150, width/2 + 150, badgeY + 150);
          badgeGrad.addColorStop(0, '#FF2E93');
          badgeGrad.addColorStop(1, '#FF8000');
          ctx.strokeStyle = badgeGrad;
          ctx.lineWidth = 10;
          ctx.stroke();
          ctx.restore();

          // Streak Number & Flame
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 130px "Space Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText(`${streakCount}`, width / 2 - 25, badgeY + 30);
          
          ctx.font = '900 90px "DM Sans", sans-serif';
          ctx.fillText('🔥', width / 2 + 80, badgeY + 15);

          ctx.fillStyle = '#a1a1aa';
          ctx.font = '700 20px "Space Mono", monospace';
          ctx.fillText('CURRENT STREAK', width / 2, badgeY + 200);

          // 6. User Personalization Info
          ctx.fillStyle = '#ffffff';
          ctx.font = '900 32px "DM Sans", sans-serif';
          ctx.fillText(userName.toUpperCase(), width / 2, 980);
          
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.font = '700 16px "Space Mono", monospace';
          ctx.fillText('GRIND MODE: ACTIVE', width / 2, 1025);

          // 7. Stats List (Vertically aligned)
          const statsY = 1120;
          const statsW = 740;
          const statsX = width / 2 - statsW / 2;

          const vertStats = [
            { label: 'TOTAL MINUTES FOCUS', value: `${totalMinutes} MIN` },
            { label: 'COMPLETED SESSIONS', value: `${sessionCount} SESSIONS` },
            { label: 'PRODUCTIVITY RATING', value: `${prodScore}/100` }
          ];

          vertStats.forEach((st, idx) => {
            const y = statsY + idx * 125;
            // Background
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            drawRoundRect(ctx, statsX, y, statsW, 95, 16, true, true);

            // Label
            ctx.fillStyle = '#a1a1aa';
            ctx.font = '700 14px "Space Mono", monospace';
            ctx.textAlign = 'left';
            ctx.fillText(st.label, statsX + 25, y + 40);

            // Value
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 24px "Space Mono", monospace';
            ctx.textAlign = 'right';
            ctx.fillText(st.value, statsX + statsW - 25, y + 55);
          });
          ctx.textAlign = 'center'; // restore center

          // 8. Bottom Quote & Watermark
          ctx.fillStyle = '#ff2e93';
          ctx.font = 'italic 24px "DM Sans", sans-serif';
          wrapText(ctx, `"${randomQuote}"`, width / 2, 1550, 800, 36);

          // (Moshi text moved to end for glitch effect)
        }

        // ================= HACKER CRT NOISE (V3.0 Psychology) =================
        const imgData = ctx.getImageData(0, 0, width, height);
        const data = imgData.data;
        for (let i = 0; i < data.length; i += 4) {
           const noise = Math.random() * 20 - 10;
           data[i] += noise;
           data[i+1] += noise;
           data[i+2] += noise;
        }
        ctx.putImageData(imgData, 0, 0);

        // Draw Glitch "POWERED BY MOSHI"
        ctx.textAlign = ratio === '9:16' ? 'center' : 'right';
        const txtX = ratio === '9:16' ? width / 2 : width - 140;
        const txtY = ratio === '9:16' ? 1720 : 770;
        ctx.font = '900 20px "Space Mono", monospace';
        
        ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
        ctx.fillText('⚡ POWERED BY MOSHI ⚡', txtX - 2, txtY);
        ctx.fillStyle = 'rgba(255, 0, 255, 0.8)';
        ctx.fillText('⚡ POWERED BY MOSHI ⚡', txtX + 2, txtY);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.fillText('⚡ POWERED BY MOSHI ⚡', txtX, txtY);

        // Tải ảnh
        try {
          const link = document.createElement('a');
          link.download = `pomodoro-flex-${ratio.replace(':', 'x')}-${new Date().getTime()}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          showToast("success", "Exported!", "Your flex image is ready! 🎉");
        } catch(e) {
          console.error("Canvas Export Error:", e);
          showToast("error", "Failed", "Could not export image.");
        }
      }

      // ========== LATE NIGHT GRIND MODE ==========
      function checkLateNightMode() {
        const hour = new Date().getHours();
        if (hour >= 22 || hour <= 4) {
            document.body.classList.add('late-night-mode');
            if(!document.body.dataset.nightToastShown) {
                showToast("info", "Late Night Grind 🌙", "Dark mode activated. Keep pushing!");
                document.body.dataset.nightToastShown = 'true';
            }
        } else {
            document.body.classList.remove('late-night-mode');
            document.body.dataset.nightToastShown = '';
        }
      }
      
      setInterval(checkLateNightMode, 60000);
      checkLateNightMode();

      // ========== FULLSCREEN FOCUS MODE ==========
      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch((err) => {
            showToast("error", "Error", "Fullscreen API not supported by your browser");
          });
        } else {
          document.exitFullscreen();
        }
      }

      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
          document.body.classList.add('fullscreen-active');
          showToast("info", "Focus Mode", "Pure immersion activated! 🚀");
        } else {
          document.body.classList.remove('fullscreen-active');
        }
      });

      // ========== KEYBOARD SHORTCUTS ==========
      document.addEventListener("keydown", (e) => {
        if (
          e.code === "Space" &&
          genderModal.classList.contains("hidden") &&
          !reportView.classList.contains("active")
        ) {
          e.preventDefault();
          startTimer();
        } else if (
          e.code === "KeyR" &&
          !reportView.classList.contains("active")
        ) {
          resetTimer();
        }
      });

      // ========== INITIALIZATION ==========
      updateDisplay();

      if ("Notification" in window && Notification.permission === "default") {
        setTimeout(() => {
          Notification.requestPermission();
        }, 3000);
      }
    </script>
  </body>
</html>
