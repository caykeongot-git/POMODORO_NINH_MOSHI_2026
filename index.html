<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus Timer ⏱️</title>

    <!-- Dynamic Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      id="favicon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>"
    />

    <!-- Canvas Confetti for modern fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
      /* Google Fonts */
      @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        /* Male Theme */
        --male-bg-1: #1a1a2e;
        --male-bg-2: #16213e;
        --male-accent-1: #0f3460;
        --male-accent-2: #533483;
        --male-highlight: #e94560;
        --male-text: #eee;
        --male-glass: rgba(255, 255, 255, 0.08);

        /* Female Theme */
        --female-bg-1: #fff0f6;
        --female-bg-2: #ffe4f1;
        --female-accent-1: #ffc4dd;
        --female-accent-2: #ffb3d9;
        --female-highlight: #ff6b9d;
        --female-text: #4a4a4a;
        --female-glass: rgba(255, 255, 255, 0.6);
      }

      body {
        font-family:
          "DM Sans",
          -apple-system,
          sans-serif;
        min-height: 100vh;
        background: #09090b; /* Fallback */
        overflow-x: hidden;
      }

      /* View Containers */
      #main-view {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 0;
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        z-index: 10;
      }

      #main-view.hidden {
        opacity: 0;
        transform: scale(0.95);
        pointer-events: none;
        position: absolute;
        width: 100%;
      }

      /* ========== ANIMATED BACKGROUNDS (Applied to main-view pseudo elements) ========== */
      #main-view.male-theme {
        background: linear-gradient(
          135deg,
          var(--male-bg-1) 0%,
          var(--male-bg-2) 100%
        );
        color: var(--male-text);
      }
      #main-view.male-theme::before {
        content: "";
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background:
          radial-gradient(
            circle at 20% 30%,
            var(--male-accent-1) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 70%,
            var(--male-accent-2) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 50% 50%,
            var(--male-highlight) 0%,
            transparent 30%
          );
        opacity: 0.4;
        animation: rotateGlow 25s linear infinite;
        z-index: -1;
        filter: blur(40px);
      }
      #main-view.male-theme::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(
            45deg,
            transparent 48%,
            rgba(233, 69, 96, 0.03) 49%,
            rgba(233, 69, 96, 0.03) 51%,
            transparent 52%
          ),
          linear-gradient(
            -45deg,
            transparent 48%,
            rgba(102, 126, 234, 0.03) 49%,
            rgba(102, 126, 234, 0.03) 51%,
            transparent 52%
          );
        background-size: 30px 30px;
        z-index: -1;
        animation: moveGrid 20s linear infinite;
      }

      #main-view.female-theme {
        background: linear-gradient(
          135deg,
          var(--female-bg-1) 0%,
          var(--female-bg-2) 100%
        );
        color: var(--female-text);
      }
      #main-view.female-theme::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(255, 182, 193, 0.4) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 80% 100%,
            rgba(255, 218, 224, 0.4) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse at 50% 50%,
            rgba(255, 192, 203, 0.3) 0%,
            transparent 60%
          );
        z-index: -1;
        animation: breatheWaves 8s ease-in-out infinite;
      }
      #main-view.female-theme::after {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0 Q45 15 30 30 Q15 15 30 0' fill='rgba(255,182,193,0.05)' /%3E%3C/svg%3E");
        z-index: -1;
        animation: floatPattern 15s linear infinite;
        opacity: 0.6;
      }

      @keyframes rotateGlow {
        0% {
          transform: rotate(0deg) scale(1);
        }
        50% {
          transform: rotate(180deg) scale(1.1);
        }
        100% {
          transform: rotate(360deg) scale(1);
        }
      }
      @keyframes moveGrid {
        0% {
          background-position:
            0 0,
            0 0;
        }
        100% {
          background-position:
            30px 30px,
            -30px -30px;
        }
      }
      @keyframes breatheWaves {
        0%,
        100% {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
        50% {
          transform: scale(1.05) translateY(-20px);
          opacity: 0.8;
        }
      }
      @keyframes floatPattern {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-60px);
        }
      }

      /* Floating Orbs & Particles tied to main view */
      .floating-elements {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
        transition: opacity 0.5s ease;
      }
      .hidden .floating-elements {
        opacity: 0;
      }

      .orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.3;
        animation: floatOrb 20s ease-in-out infinite;
        will-change: transform, filter;
      }
      .male-theme .orb:nth-child(1) {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, #e94560, transparent);
        top: -150px;
        left: -150px;
        animation-delay: 0s;
      }
      .male-theme .orb:nth-child(2) {
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, #667eea, transparent);
        bottom: -200px;
        right: -200px;
        animation-delay: 5s;
      }
      .male-theme .orb:nth-child(3) {
        width: 250px;
        height: 250px;
        background: radial-gradient(circle, #764ba2, transparent);
        top: 50%;
        left: 50%;
        animation-delay: 10s;
      }
      .female-theme .orb:nth-child(1) {
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, #ffc4dd, transparent);
        top: -100px;
        right: -100px;
        animation-delay: 0s;
      }
      .female-theme .orb:nth-child(2) {
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, #ff9a9e, transparent);
        bottom: -150px;
        left: -150px;
        animation-delay: 7s;
      }
      .female-theme .orb:nth-child(3) {
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, #ffb3d9, transparent);
        top: 30%;
        right: 20%;
        animation-delay: 14s;
      }
      @keyframes floatOrb {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        25% {
          transform: translate(50px, -50px) scale(1.1);
        }
        50% {
          transform: translate(-30px, 30px) scale(0.9);
        }
        75% {
          transform: translate(40px, 60px) scale(1.05);
        }
      }

      .particle {
        position: absolute;
        border-radius: 50%;
        animation: float 15s infinite ease-in-out;
        will-change: transform, opacity;
      }
      .male-theme .particle {
        background: radial-gradient(
          circle,
          rgba(233, 69, 96, 0.6),
          transparent
        );
        box-shadow: 0 0 20px rgba(233, 69, 96, 0.4);
      }
      .female-theme .particle {
        background: radial-gradient(
          circle,
          rgba(255, 182, 193, 0.6),
          transparent
        );
        box-shadow: 0 0 15px rgba(255, 182, 193, 0.3);
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0) translateX(0) scale(0);
          opacity: 0;
        }
        5% {
          opacity: 1;
          transform: scale(1);
        }
        95% {
          opacity: 1;
        }
        100% {
          transform: translateY(-100vh) translateX(100px) scale(0.5);
          opacity: 0;
        }
      }

      /* ========== UI COMPONENTS ========== */
      .toast-container {
        position: fixed;
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100000;
        pointer-events: none;
      }
      .toast {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(30px) saturate(180%);
        padding: 20px 30px;
        border-radius: 20px;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.3),
          0 0 0 1px rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        gap: 15px;
        min-width: 320px;
        max-width: 90vw;
        transform: translateY(-150%) scale(0.8);
        opacity: 0;
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        pointer-events: all;
        border: 2px solid transparent;
      }
      .toast.show {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      .toast.warning {
        border-color: #ff9800;
      }
      .toast.success {
        border-color: #4caf50;
      }
      .toast.info {
        border-color: #2196f3;
      }
      .toast-error {
        border-color: #f44336;
      }
      .toast-icon {
        font-size: 32px;
        flex-shrink: 0;
        animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      }
      @keyframes bounceIn {
        0% {
          transform: scale(0);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }
      .toast-content {
        flex: 1;
      }
      .toast-title {
        font-size: 16px;
        font-weight: 700;
        color: #333;
        margin-bottom: 4px;
      }
      .toast-message {
        font-size: 14px;
        color: #666;
        line-height: 1.4;
      }

      .gender-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(20px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        animation: fadeIn 0.5s ease;
      }
      .gender-modal.hidden {
        display: none;
      }
      .gender-content {
        text-align: center;
        padding: 60px 40px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 30px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        animation: scaleIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        max-width: 500px;
        width: 90%;
      }
      @keyframes scaleIn {
        0% {
          transform: scale(0.8);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .gender-content h2 {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 16px;
        background: linear-gradient(90deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gender-content p {
        font-size: 16px;
        color: #666;
        margin-bottom: 40px;
      }
      .gender-buttons {
        display: flex;
        gap: 20px;
        justify-content: center;
      }
      .gender-btn {
        padding: 20px 40px;
        font-size: 18px;
        font-weight: 700;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
      }
      .gender-btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition:
          width 0.6s,
          height 0.6s;
      }
      .gender-btn:hover::before {
        width: 300px;
        height: 300px;
      }
      .gender-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      }
      .gender-btn:active {
        transform: translateY(-2px) scale(0.98);
      }
      .gender-btn.male {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      .gender-btn.female {
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        color: white;
      }

      /* Dynamic Island */
      .dynamic-island {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) scale(0);
        background: rgba(0, 0, 0, 0.9);
        backdrop-filter: blur(30px) saturate(180%);
        padding: 14px 28px;
        border-radius: 50px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 15px;
        font-weight: 600;
        z-index: 1000;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        opacity: 0;
        transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        font-family: "Space Mono", monospace;
        color: white;
      }
      .dynamic-island.active {
        transform: translateX(-50%) scale(1);
        opacity: 1;
      }
      .island-pulse {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #30d158;
        animation: pulse 2s ease-in-out infinite;
        box-shadow: 0 0 10px #30d158;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.6;
          transform: scale(1.3);
        }
      }

      /* Main Container (Timer) */
      .container {
        width: 90%;
        max-width: 520px;
        padding: 50px 40px;
        border-radius: 40px;
        position: relative;
        z-index: 10;
        animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1);
        backdrop-filter: blur(40px) saturate(150%);
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.15);
        transition: all 0.5s ease;
        margin-top: 20px;
      }
      .male-theme .container {
        background: rgba(255, 255, 255, 0.05);
      }
      .female-theme .container {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(255, 182, 193, 0.3);
      }
      @keyframes fadeInUp {
        0% {
          opacity: 0;
          transform: translateY(40px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }
      .header h1 {
        font-size: 32px;
        font-weight: 900;
        letter-spacing: -1px;
        margin-bottom: 8px;
        animation: slideInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .male-theme .header h1 {
        background: linear-gradient(90deg, #e94560, #ff6b9d);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .female-theme .header h1 {
        background: linear-gradient(90deg, #ff6b9d, #c06c84);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      @keyframes slideInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .mode-indicator {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.7;
        animation: fadeIn 1s ease 0.2s both;
      }

      .stats {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin: 20px 0;
        animation: fadeIn 1s ease 0.4s both;
      }
      .stat-item {
        padding: 12px 20px;
        border-radius: 16px;
        backdrop-filter: blur(10px);
        font-size: 13px;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .male-theme .stat-item {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .female-theme .stat-item {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 182, 193, 0.2);
      }
      .stat-item:hover {
        transform: translateY(-3px) scale(1.05);
      }
      .stat-value {
        font-size: 18px;
        font-weight: 800;
        display: block;
      }
      .male-theme .stat-value {
        color: #e94560;
      }
      .female-theme .stat-value {
        color: #ff6b9d;
      }

      .timer-display {
        text-align: center;
        margin: 40px 0;
        position: relative;
      }
      .timer-circle {
        width: 280px;
        height: 280px;
        margin: 0 auto;
        position: relative;
        animation: scaleIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
      }
      .timer-circle::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          circle,
          rgba(233, 69, 96, 0.2) 0%,
          transparent 70%
        );
        transform: translate(-50%, -50%);
        animation: breathe 3s ease-in-out infinite;
      }
      .timer-circle svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
        filter: drop-shadow(0 0 20px rgba(233, 69, 96, 0.3));
      }
      .progress-ring-bg {
        fill: none;
        stroke-width: 10;
        opacity: 0.15;
      }
      .male-theme .progress-ring-bg {
        stroke: #e94560;
      }
      .female-theme .progress-ring-bg {
        stroke: #ff6b9d;
      }
      .progress-ring {
        fill: none;
        stroke-width: 10;
        stroke-linecap: round;
        transition: stroke-dashoffset 1s linear;
      }
      .male-theme .progress-ring {
        stroke: url(#maleGradient);
      }
      .female-theme .progress-ring {
        stroke: url(#femaleGradient);
      }
      .time {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 56px;
        font-weight: 900;
        letter-spacing: -2px;
        font-family: "Space Mono", monospace;
        text-shadow: 0 2px 30px rgba(0, 0, 0, 0.1);
      }

      .caption {
        text-align: center;
        margin: 30px 0;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .caption-text {
        font-size: 17px;
        font-weight: 500;
        line-height: 1.6;
        font-style: italic;
        animation: fadeIn 0.8s ease;
        max-width: 400px;
      }
      .male-theme .caption-text {
        color: rgba(255, 255, 255, 0.8);
      }
      .female-theme .caption-text {
        color: rgba(0, 0, 0, 0.7);
      }

      .presets {
        display: flex;
        gap: 10px;
        margin: 25px 0;
        flex-wrap: wrap;
        justify-content: center;
      }
      .preset-btn {
        padding: 12px 24px;
        border-radius: 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
        border: 1px solid;
        animation: fadeIn 0.6s ease both;
      }
      .preset-btn:nth-child(1) {
        animation-delay: 0.5s;
      }
      .preset-btn:nth-child(2) {
        animation-delay: 0.6s;
      }
      .preset-btn:nth-child(3) {
        animation-delay: 0.7s;
      }
      .preset-btn:nth-child(4) {
        animation-delay: 0.8s;
      }
      .preset-btn:nth-child(5) {
        animation-delay: 0.9s;
      }
      .male-theme .preset-btn {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 0.9);
      }
      .female-theme .preset-btn {
        background: rgba(255, 255, 255, 0.6);
        border-color: rgba(255, 182, 193, 0.3);
        color: rgba(0, 0, 0, 0.8);
      }
      .preset-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      }
      .male-theme .preset-btn:hover {
        background: rgba(233, 69, 96, 0.3);
        border-color: rgba(233, 69, 96, 0.5);
      }
      .female-theme .preset-btn:hover {
        background: rgba(255, 182, 193, 0.5);
        border-color: rgba(255, 107, 157, 0.5);
      }
      .preset-btn:active {
        transform: translateY(0) scale(0.95);
      }

      .custom-input {
        display: flex;
        gap: 12px;
        justify-content: center;
        align-items: center;
        margin: 20px 0;
        animation: fadeIn 0.8s ease 1s both;
      }
      .custom-input input {
        width: 100px;
        padding: 14px;
        border-radius: 16px;
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        border: 1px solid;
      }
      .male-theme .custom-input input {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
        color: white;
      }
      .female-theme .custom-input input {
        background: rgba(255, 255, 255, 0.6);
        border-color: rgba(255, 182, 193, 0.3);
        color: #333;
      }
      .custom-input input::placeholder {
        opacity: 0.5;
      }
      .custom-input input:focus {
        outline: none;
        transform: scale(1.05);
      }

      .controls {
        display: flex;
        gap: 16px;
        justify-content: center;
        margin-top: 30px;
        animation: fadeIn 0.8s ease 1.1s both;
      }
      .btn {
        padding: 18px 40px;
        border: none;
        border-radius: 20px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        position: relative;
        overflow: hidden;
      }
      .btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition:
          width 0.6s,
          height 0.6s;
      }
      .btn:hover::before {
        width: 300px;
        height: 300px;
      }
      .btn-primary {
        flex: 1;
        position: relative;
        z-index: 1;
      }
      .male-theme .btn-primary {
        background: linear-gradient(135deg, #e94560 0%, #ff6b9d 100%);
        color: white;
      }
      .female-theme .btn-primary {
        background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
        color: white;
      }
      .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      }
      .btn-primary:active {
        transform: translateY(0) scale(0.97);
      }
      .btn-secondary {
        border: 2px solid;
        background: transparent;
      }
      .male-theme .btn-secondary {
        border-color: rgba(233, 69, 96, 0.5);
        color: rgba(255, 255, 255, 0.9);
      }
      .female-theme .btn-secondary {
        border-color: rgba(255, 107, 157, 0.5);
        color: rgba(0, 0, 0, 0.8);
      }
      .btn-secondary:hover {
        transform: translateY(-3px);
      }
      .male-theme .btn-secondary:hover {
        background: rgba(233, 69, 96, 0.2);
      }
      .female-theme .btn-secondary:hover {
        background: rgba(255, 107, 157, 0.2);
      }

      .export-btn {
        margin-top: 20px;
        width: 100%;
        padding: 18px;
        border-radius: 20px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        border: 2px dashed;
        background: transparent;
        transition: all 0.3s ease;
        animation: fadeIn 0.8s ease 1.3s both;
      }
      .male-theme .export-btn {
        border-color: rgba(233, 69, 96, 0.5);
        color: rgba(255, 255, 255, 0.9);
      }
      .female-theme .export-btn {
        border-color: rgba(255, 107, 157, 0.5);
        color: rgba(0, 0, 0, 0.8);
      }
      .export-btn:hover {
        transform: translateY(-3px);
      }
      .male-theme .export-btn:hover {
        background: rgba(233, 69, 96, 0.15);
        border-style: solid;
      }
      .female-theme .export-btn:hover {
        background: rgba(255, 107, 157, 0.15);
        border-style: solid;
      }

      .theme-toggle {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        backdrop-filter: blur(20px);
        border: 2px solid;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: 100;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      }
      .male-theme .theme-toggle {
        background: rgba(255, 255, 255, 0.08);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .female-theme .theme-toggle {
        background: rgba(255, 255, 255, 0.7);
        border-color: rgba(255, 182, 193, 0.3);
      }
      .theme-toggle:hover {
        transform: scale(1.15) rotate(90deg);
      }

      /* * ==========================================
       * NEW REPORT VIEW - INTERACTIVE DASHBOARD
       * ==========================================
       */
      #report-view {
        position: fixed;
        inset: 0;
        z-index: 90000;
        background: #09090b; /* Ultra dark pro background */
        color: white;
        /* FIX: Changed from flex to block to perfectly support scrolling without cutoff */
        display: block;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch; /* Smooth iOS scroll */
        opacity: 0;
        pointer-events: none;
        transform: scale(1.05);
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #report-view.active {
        opacity: 1;
        pointer-events: all;
        transform: scale(1);
      }

      /* Glowing Orbs for Report */
      .report-glow-1 {
        position: fixed;
        top: -10vw;
        left: -10vw;
        width: 50vw;
        height: 50vw;
        min-width: 400px;
        min-height: 400px;
        background: radial-gradient(
          circle,
          rgba(255, 46, 147, 0.3) 0%,
          transparent 70%
        );
        z-index: 0;
        pointer-events: none;
      }
      .report-glow-2 {
        position: fixed;
        bottom: -10vw;
        right: -10vw;
        width: 60vw;
        height: 60vw;
        min-width: 500px;
        min-height: 500px;
        background: radial-gradient(
          circle,
          rgba(255, 128, 0, 0.2) 0%,
          transparent 70%
        );
        z-index: 0;
        pointer-events: none;
      }

      .report-card {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 600px;
        min-height: 100vh;
        margin: 0 auto; /* Center horizontally */
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 80px 20px 40px 20px; /* Space for the floating back button */
      }

      .back-btn {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
        padding: 10px 20px;
        border-radius: 50px;
        font-family: "DM Sans", sans-serif;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: all 0.3s ease;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .back-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: translateX(-5px);
      }

      .report-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-top: 0;
        margin-bottom: 40px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 30px;
        animation: slideInDown 0.8s ease both;
      }
      .report-header h1 {
        font-size: clamp(36px, 8vw, 48px);
        font-weight: 900;
        margin: 0;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        letter-spacing: -1px;
      }
      .report-header p {
        font-size: 16px;
        color: #a1a1aa;
        margin: 10px 0 0 0;
        font-family: "Space Mono", monospace;
      }
      .report-header .icon {
        font-size: clamp(40px, 8vw, 52px);
        color: white;
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      }

      /* KPI Cards */
      .report-kpi-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 30px;
      }
      .report-kpi-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 25px 20px;
        backdrop-filter: blur(20px);
        transition: transform 0.3s ease;
        animation: fadeInUp 0.8s ease backwards;
      }
      .report-kpi-card:hover {
        transform: translateY(-5px);
      }
      .report-kpi-grid .report-kpi-card:nth-child(1) {
        animation-delay: 0.1s;
      }
      .report-kpi-grid .report-kpi-card:nth-child(2) {
        animation-delay: 0.2s;
      }
      .report-kpi-grid .report-kpi-card:nth-child(3) {
        animation-delay: 0.3s;
      }
      .report-kpi-grid .report-kpi-card:nth-child(4) {
        animation-delay: 0.4s;
      }
      .report-kpi-grid .report-kpi-card:nth-child(5) {
        animation-delay: 0.5s;
      }
      .report-kpi-grid .report-kpi-card:nth-child(6) {
        animation-delay: 0.6s;
      }

      .kpi-label {
        font-size: 13px;
        color: #a1a1aa;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .kpi-val {
        font-size: clamp(32px, 8vw, 42px);
        font-weight: 900;
        font-family: "Space Mono", monospace;
        display: flex;
        align-items: baseline;
        gap: 6px;
        color: #ffffff;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }
      .kpi-val .unit {
        font-size: 16px;
        color: #a1a1aa;
        font-weight: 600;
        font-family: "DM Sans", sans-serif;
        text-shadow: none;
      }

      .kpi-highlight {
        background: rgba(255, 46, 147, 0.1);
        border-color: rgba(255, 46, 147, 0.3);
      }
      .kpi-highlight .kpi-val {
        color: #ff2e93;
        text-shadow: 0 0 15px rgba(255, 46, 147, 0.4);
      }
      .kpi-highlight .kpi-val .unit {
        color: rgba(255, 46, 147, 0.7);
      }

      /* Charts */
      .report-charts-row {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-bottom: 30px;
        animation: fadeInUp 0.8s ease 0.7s backwards;
      }
      @media (min-width: 500px) {
        .report-charts-row {
          grid-template-columns: 1.2fr 1fr;
        }
      }
      .report-chart-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 25px 20px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .report-chart-title {
        font-size: 16px;
        font-weight: 800;
        color: white;
        margin-bottom: 20px;
      }

      .report-timeline {
        display: flex;
        flex-direction: column;
        gap: 14px;
        flex: 1;
        justify-content: center;
      }
      .report-timeline-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .report-timeline-time {
        width: 65px;
        font-size: 13px;
        color: #a1a1aa;
        font-family: "Space Mono", monospace;
      }
      .report-timeline-bar-wrapper {
        flex: 1;
        height: 12px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 6px;
        overflow: hidden;
      }
      .report-timeline-bar {
        height: 100%;
        border-radius: 6px;
        background: linear-gradient(90deg, #ff2e93, #ff8000);
        width: 0%;
        transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .report-timeline-mins {
        width: 45px;
        font-size: 14px;
        color: white;
        font-weight: 800;
        text-align: right;
      }

      .report-footer {
        margin-top: auto;
        padding-top: 30px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        text-align: center;
        animation: fadeIn 1s ease 1s backwards;
      }
      .report-quote {
        font-size: clamp(20px, 5vw, 24px);
        font-style: italic;
        color: white;
        margin-bottom: 20px;
        font-weight: 500;
        line-height: 1.4;
        text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      }
      .report-watermark {
        font-size: 14px;
        color: #a1a1aa;
        font-weight: 700;
        letter-spacing: 4px;
        text-transform: uppercase;
      }

      /* Responsive Core */
      @media (max-width: 600px) {
        .container {
          padding: 40px 25px;
          border-radius: 32px;
          margin-top: 10px;
        }
        .timer-circle {
          width: 240px;
          height: 240px;
        }
        .time {
          font-size: 48px;
        }
        .header h1 {
          font-size: 28px;
        }
        .caption-text {
          font-size: 15px;
        }
        .stats {
          gap: 8px;
        }
        .stat-item {
          padding: 10px 16px;
          font-size: 12px;
        }
        .stat-value {
          font-size: 16px;
        }
        .preset-btn {
          padding: 10px 18px;
          font-size: 13px;
        }
        .btn {
          padding: 16px 32px;
          font-size: 15px;
        }
        .gender-content {
          padding: 40px 30px;
        }
        .gender-buttons {
          flex-direction: column;
        }
        .gender-btn {
          width: 100%;
        }
        .theme-toggle {
          width: 50px;
          height: 50px;
          font-size: 22px;
          bottom: 20px;
          right: 20px;
        }
        .toast {
          min-width: 280px;
          padding: 18px 24px;
        }
        .toast-icon {
          font-size: 28px;
        }
        .toast-title {
          font-size: 15px;
        }
        .toast-message {
          font-size: 13px;
        }

        /* Report Mobile Adjustments */
        .report-card {
          padding: 80px 15px 30px 15px;
        } /* Ensure button space */
        .report-header {
          margin-top: 0;
          margin-bottom: 30px;
        }
        .report-kpi-card {
          padding: 20px 15px;
        }
      }
      @media (max-width: 400px) {
        .timer-circle {
          width: 200px;
          height: 200px;
        }
        .time {
          font-size: 40px;
        }
        .stats {
          flex-direction: column;
          gap: 8px;
        }
        .presets {
          gap: 8px;
        }
        .controls {
          flex-direction: column;
        }
        .btn-primary {
          width: 100%;
        }
      }
      
      /* PC Spatial Dashboard Layout */
      @media (min-width: 1024px) {
        .container {
          max-width: 1400px;
          width: 95vw;
          min-height: 80vh;
          display: grid;
          grid-template-columns: 1fr 1.2fr 1fr;
          grid-template-areas: 
            "header timer stats"
            "mode timer stats"
            "presets timer caption"
            "custom timer caption"
            "controls controls export";
          gap: 20px 40px;
          align-items: center;
          padding: 60px 50px;
          background: rgba(255, 255, 255, 0.02);
          border: 1px solid rgba(255, 255, 255, 0.05);
          backdrop-filter: blur(50px) saturate(200%);
          box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .female-theme .container {
          background: rgba(255, 255, 255, 0.4);
          border: 1px solid rgba(255, 182, 193, 0.4);
        }
        .header { grid-area: header; margin-bottom: 0; text-align: left; }
        .mode-indicator { grid-area: mode; text-align: left; }
        .stats { grid-area: stats; margin: 10px 0; flex-direction: column; gap: 20px; align-items: stretch; }
        .timer-display { grid-area: timer; margin: 0; display: flex; justify-content: center; align-items: center; }
        .timer-circle { width: 420px; height: 420px; }
        .time { font-size: 80px; }
        .caption { grid-area: caption; margin: 15px 0; text-align: right; justify-content: flex-end; }
        .presets { grid-area: presets; margin: 10px 0; justify-content: flex-start; }
        .custom-input { grid-area: custom; margin: 10px 0; justify-content: flex-start; }
        .controls { grid-area: controls; margin-top: 10px; justify-content: center; }
        .export-btn { grid-area: export; margin-top: 10px; width: 100%; }
        
        .stat-item {
          padding: 20px 25px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 15px;
        }
        .stat-value {
          font-size: 24px;
        }
      }

      /* Fullscreen Cinematic Focus Mode */
      body.fullscreen-active {
        overflow: hidden;
      }
      body.fullscreen-active .container {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        max-width: none !important;
        border-radius: 0 !important;
        border: none !important;
        margin: 0 !important;
        z-index: 999999 !important;
        background: transparent !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
      }
      body.fullscreen-active .timer-circle {
        transform: scale(1.4);
        filter: drop-shadow(0 0 40px rgba(233, 69, 96, 0.4));
        transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }
      body.fullscreen-active.female-theme .timer-circle {
        filter: drop-shadow(0 0 40px rgba(255, 107, 157, 0.4));
      }
      
      body.fullscreen-active .header,
      body.fullscreen-active .mode-indicator,
      body.fullscreen-active .stats,
      body.fullscreen-active .presets,
      body.fullscreen-active .custom-input,
      body.fullscreen-active .export-btn,
      body.fullscreen-active .caption,
      body.fullscreen-active .controls {
        opacity: 0.1 !important; 
        filter: blur(2px);
        transition: all 0.5s ease !important;
      }
      
      body.fullscreen-active .header:hover,
      body.fullscreen-active .mode-indicator:hover,
      body.fullscreen-active .stats:hover,
      body.fullscreen-active .presets:hover,
      body.fullscreen-active .custom-input:hover,
      body.fullscreen-active .export-btn:hover,
      body.fullscreen-active .caption:hover,
      body.fullscreen-active .controls:hover {
        opacity: 1 !important;
        filter: blur(0);
      }
      
      /* Late Night Grind Mode - Cyberpunk/Deep Purple instead of black */
      body.late-night-mode {
        background-color: #030008 !important;
      }
      body.late-night-mode .container {
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        background: rgba(10, 5, 20, 0.8) !important;
        border: 1px solid rgba(138, 43, 226, 0.2);
        backdrop-filter: blur(60px);
      }
      body.late-night-mode .orb {
        opacity: 0.25 !important;
        filter: hue-rotate(240deg) saturate(150%) brightness(0.8) blur(60px) !important;
      }
      body.late-night-mode .particle {
        opacity: 0.4 !important;
        box-shadow: 0 0 10px rgba(138, 43, 226, 0.8) !important;
      }
      /* V3.0 Psychology Additions */
      @keyframes glitch {
        0% { box-shadow: 0 0 0 rgba(255, 255, 255, 0); transform: scale(1); }
        50% { box-shadow: 0 0 60px rgba(233, 69, 96, 0.8), inset 0 0 30px rgba(233, 69, 96, 0.5); transform: scale(1.02); border-color: rgba(233, 69, 96, 1); }
        100% { box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1); transform: scale(1); }
      }
      .female-theme .container.ignition {
        animation: glitchFemale 0.5s ease-out;
      }
      @keyframes glitchFemale {
        0% { box-shadow: 0 0 0 rgba(255, 255, 255, 0); transform: scale(1); }
        50% { box-shadow: 0 0 60px rgba(255, 107, 157, 0.8), inset 0 0 30px rgba(255, 107, 157, 0.5); transform: scale(1.02); border-color: rgba(255, 107, 157, 1); }
        100% { box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1); transform: scale(1); }
      }
      .container.ignition {
        animation: glitch 0.5s ease-out;
      }
      
      /* Flow State & Loss Aversion */
      body.timer-running .orb {
        animation-duration: 5s !important;
        filter: hue-rotate(45deg) saturate(200%) brightness(1.2) blur(50px) !important;
        transition: all 1s ease;
      }
      body.timer-running .timer-circle::before {
        animation-duration: 1s !important;
        background: radial-gradient(circle, rgba(255, 0, 0, 0.3) 0%, transparent 70%);
      }
      body.timer-running .female-theme .timer-circle::before {
        background: radial-gradient(circle, rgba(255, 46, 147, 0.3) 0%, transparent 70%);
      }
      body.timer-running #resetBtn {
        opacity: 0.4;
        border-color: rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.5);
      }
      body.timer-running .female-theme #resetBtn {
        border-color: rgba(0, 0, 0, 0.2);
        color: rgba(0, 0, 0, 0.5);
      }
      body.timer-running #resetBtn:hover {
        opacity: 1;
        color: inherit;
        border-color: inherit;
      }
      /* V4.0 God Mode Additions */
      @keyframes pulseAlert {
        0% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); border-color: rgba(255, 0, 0, 0.5); transform: scale(1); }
        50% { box-shadow: 0 0 80px rgba(255, 0, 0, 0.8), inset 0 0 40px rgba(255, 0, 0, 0.5); border-color: rgba(255, 0, 0, 1); transform: scale(1.02); }
        100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); border-color: rgba(255, 0, 0, 0.5); transform: scale(1); }
      }
      body.crunch-time .container {
        animation: pulseAlert 0.8s infinite;
      }
      body.crunch-time .orb {
        animation-duration: 2s !important;
        filter: hue-rotate(0deg) saturate(300%) brightness(1.5) blur(40px) !important;
      }
      body.crunch-time .timer-circle {
        filter: drop-shadow(0 0 50px rgba(255, 0, 0, 0.8));
      }
      body.crunch-time .timer-circle::before {
        animation-duration: 0.4s !important;
        background: radial-gradient(circle, rgba(255, 0, 0, 0.6) 0%, transparent 70%);
      }
      
      @keyframes floatUp {
        0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
        20% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
        80% { opacity: 1; transform: translate(-50%, -80px) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -100px) scale(0.8); }
      }
      .xp-float {
        position: fixed;
        top: 40%;
        left: 50%;
        transform: translateX(-50%);
        color: #00ff88;
        font-family: 'Space Mono', monospace;
        font-weight: 900;
        font-size: 32px;
        text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
        z-index: 9999999;
        pointer-events: none;
        animation: floatUp 2.5s ease-out forwards;
      }
      .female-theme .xp-float {
        color: #ffb1c1;
        text-shadow: 0 0 20px rgba(255, 177, 193, 0.8);
      }
    </style>
  </head>
  <body>
    <!-- Gender Modal -->
    <div class="gender-modal" id="genderModal">
      <div class="gender-content">
        <h2>✨ Welcome!</h2>
        <p>Select your aesthetic</p>
        <div class="gender-buttons">

            >
          </button>

    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Main View Wrap -->
    <div id="main-view">
      <!-- Floating Orbs -->
      <div class="floating-elements">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
        <div id="particles"></div>
      </div>

      <!-- Dynamic Island -->
      <div class="dynamic-island" id="dynamicIsland">
        <div class="island-pulse"></div>

      <!-- Theme Toggle -->
      <button

        id="themeToggle"

      </button>

      <!-- Lofi Mood Toggle -->

        class="theme-toggle"

        🎧
      </button>

      <!-- Fullscreen Toggle -->
      <button

      </audio>

      <!-- Main Container -->
      <div class="container">

        <!-- Stats -->
        <div class="stats">
          <div class="stat-item">
            <span class="stat-value" id="sessionCount">0</span
            ><span>Sessions</span>
          </div>
          <div class="stat-item">

            ><span>Minutes</span>
          </div>

              <circle

              <circle

        <!-- Caption (Vietnamese) -->
        <div class="caption">

        <div class="presets">

    <!-- ================= REPORT VIEW DASHBOARD ================= -->
    <div id="report-view">
      <div class="report-glow-1"></div>
      <div class="report-glow-2"></div>

      <div class="report-card">
        <button class="back-btn" onclick="hideReport()">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"

          >

          Back to Focus

        <!-- Inner content populated by JS -->

    <script>
      // State
      let totalSeconds = 25 * 60;
      let remainingSeconds = totalSeconds;
      let timerInterval = null;
      let isRunning = false;
      let isBreakMode = false;
      let notificationEnabled = true;
      let currentTheme = null;

      // Session Stats (Persisted with LocalStorage)
      let sessionCount = parseInt(localStorage.getItem('pomodoro_sessionCount')) || 0;
      let totalMinutes = parseInt(localStorage.getItem('pomodoro_totalMinutes')) || 0;
      let totalBreakMinutes = parseInt(localStorage.getItem('pomodoro_totalBreakMinutes')) || 0;
      let streakCount = parseInt(localStorage.getItem('pomodoro_streakCount')) || 0;
      let maxStreak = parseInt(localStorage.getItem('pomodoro_maxStreak')) || 0;
      let sessionHistory = JSON.parse(localStorage.getItem('pomodoro_history')) || [];
      // Restore Date objects
      sessionHistory.forEach(s => s.timestamp = new Date(s.timestamp));
      let sessionStartTime = new Date();

      // User Personalization (XSS Safe)
      let userName = localStorage.getItem('pomodoro_userName') || 'Grinder';
      function saveNameToLocal(val) {
        // Escape HTML to prevent DOM XSS
        const escaped = val.replace(/[<>&"'`]/g, (char) => {
          return {
            '<': '&lt;',
            '>': '&gt;',
            '&': '&amp;',
            '"': '&quot;',
            "'": '&#39;',
            '`': '&#96;'
          }[char];
        });
        userName = escaped.trim() || 'Grinder';
        localStorage.setItem('pomodoro_userName', userName);
      }

      // DOM Elements
      const mainView = document.getElementById("main-view");
      const reportView = document.getElementById("report-view");
      const reportContent = document.getElementById("report-content");

      const timerDisplay = document.getElementById("timerDisplay");
      const progressRing = document.getElementById("progressRing");
      const startBtn = document.getElementById("startBtn");
      const captionText = document.getElementById("captionText");
      const modeIndicator = document.getElementById("modeIndicator");
      const dynamicIsland = document.getElementById("dynamicIsland");
      const islandText = document.getElementById("islandText");
      const genderModal = document.getElementById("genderModal");

      // Circle
      const radius = 125;
      const circumference = 2 * Math.PI * radius;
      progressRing.style.strokeDasharray = circumference;
      progressRing.style.strokeDashoffset = 0;

      // Captions (Vietnamese)
      const maleFocusCaptions = [
        "Tập trung như pro player clutch round cuối! 🎮",
        "Code không bug, đời không khổ! 💻",
        "25 phút này là của alpha! 💪",
        "Grind mode: ACTIVATED 🔥",
        "Học giỏi thì mới flex được! 📈",
        "Every pro was once a beginner! 🚀",
        "Focus như đang rank Immortal! ⚡",
        "Không pain, không gain bro! 💎",
        "Cày ngay đi, sau này hưởng! 🎯",
        "Đừng để tương lai phải hối tiếc! ⚔️",
      ];
      const maleBreakCaptions = [
        "Legend cũng cần hồi máu! 💊",
        "Respawn năng lượng... 🔄",
        "Quick break, ready next round! ⚡",
        "Stretch it out bro! 🤸",
        "Nạp năng lượng như nạp RP! 🔋",
        "Nghỉ tí rồi comeback mạnh hơn! 💪",
        "Boss fight sắp tới, ready up! 🎮",
        "Uống nước đi, hydrate is key! 💧",
        "5 phút chill, sau lại bay! 🚀",
        "Break time không có nghĩa là AFK! ⏸️",
      ];
      const femaleFocusCaptions = [
        "Học giỏi để tự tự tin tỏa sáng nha! ✨",
        "25 phút này là của em yêu! 💕",
        "Cố lên, bạn làm được mà! 🌸",
        "Tập trung học, sau đi shopping! 🛍️",
        "Mỗi phút học là thêm một bước! 🌈",
        "Đẹp là phải, giỏi là must have! 💅",
        "Học hành chăm chỉ, mai sau thành công! 🌟",
        "Focus mode: Pretty & Smart! 💖",
        "Đừng để phone làm phân tâm nhé! 📱❌",
        "Bạn xứng đáng với điều tốt nhất! 🦋",
      ];
      const femaleBreakCaptions = [
        "Nghỉ ngơi là chăm sóc bản thân đấy! 🌺",
        "Thư giãn một chút, deserve it! ☕",
        "Deep breath in... and out... 🧘‍♀️",
        "5 phút self-care time! 💆‍♀️",
        "Uống nước cho da đẹp nha! 💧✨",
        "Nghỉ ngơi để xinh đẹp hơn! 🌸",
        "Break time = me time! 💕",
        "Đứng dậy duỗi người nhé! 🦋",
        "Nghỉ tí rồi tiếp tục tỏa sáng! ⭐",
        "Relax mode: ON! 🌈",
      ];

      let focusCaptions = [];
      let breakCaptions = [];

      // ========== TOAST NOTIFICATION SYSTEM ==========
      function showToast(type, title, message, duration = 4000) {
        const container = document.getElementById("toastContainer");
        const toast = document.createElement("div");
        toast.className = `toast ${type}`;
        const icons = { warning: "⚠️", success: "✅", info: "ℹ️", error: "❌" };
        toast.innerHTML = `
                <div class="toast-icon">${icons[type] || "💬"}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                </div>
                <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            `;
        container.appendChild(toast);
        setTimeout(() => toast.classList.add("show"), 10);
        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 500);
        }, duration);
      }

      // ========== PARTICLE SYSTEM ==========
      function generateParticles() {
        const particlesContainer = document.getElementById("particles");
        particlesContainer.innerHTML = "";
        for (let i = 0; i < 25; i++) {
          const particle = document.createElement("div");
          particle.className = "particle";
          const size = Math.random() * 4 + 2;
          particle.style.width = size + "px";
          particle.style.height = size + "px";
          particle.style.left = Math.random() * 100 + "%";
          particle.style.animationDelay = Math.random() * 15 + "s";
          particle.style.animationDuration = 12 + Math.random() * 8 + "s";
          particlesContainer.appendChild(particle);
        }
      }

      // ========== GENDER SELECTION ==========
      function selectGender(gender) {
        currentTheme = gender;
        mainView.className = gender + "-theme";
        genderModal.classList.add("hidden");

        if (gender === "male") {
          focusCaptions = maleFocusCaptions;
          breakCaptions = maleBreakCaptions;
        } else {
          focusCaptions = femaleFocusCaptions;
          breakCaptions = femaleBreakCaptions;
        }

        changeCaption();
        generateParticles();
        updateStatsDisplay();
      }

      function toggleTheme() {
        const newTheme = currentTheme === "male" ? "female" : "male";
        selectGender(newTheme);
      }

      // ========== STATS & DISPLAY ==========
      function updateStatsDisplay() {
        document.getElementById("sessionCount").textContent = sessionCount;
        document.getElementById("totalMinutes").textContent = totalMinutes;
        document.getElementById("streakCount").textContent = streakCount;
      }

      function updateDisplay() {
        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        const timeStr = `${minutes.toString().padStart(2, "0")}:${seconds.toString().padStart(2, "0")}`;
        timerDisplay.textContent = timeStr;

        if (isRunning) {
          document.title = `${timeStr} - Focus Timer ⏱️`;
        } else {
          document.title = "Focus Timer ⏱️";
        }

        const progress = remainingSeconds / totalSeconds;
        const offset = circumference * (1 - progress);
        progressRing.style.strokeDashoffset = offset;

        if (isRunning) {
          islandText.textContent = timeStr;
        }
      }

      // ========== TIMER CONTROLS ==========
      function setTimer(minutes) {
        if (isRunning) return;
        totalSeconds = minutes * 60;
        remainingSeconds = totalSeconds;
        updateDisplay();
        changeCaption();
      }

      function setCustomTimer() {
        const customMinutes = parseInt(
          document.getElementById("customMinutes").value,
        );
        if (customMinutes && customMinutes > 0 && customMinutes <= 120) {
          setTimer(customMinutes);
          document.getElementById("customMinutes").value = "";
          showToast(
            "info",
            "Timer set!",
            `${customMinutes} minutes - Ready to grind! 💪`,
          );
        }
      }

      let resetClickCount = 0;
      function showXP() {
         const xp = document.createElement("div");
         xp.className = "xp-float";
         xp.textContent = "+25 FOCUS XP";
         document.body.appendChild(xp);
         setTimeout(() => xp.remove(), 2500);
      }

      function startTimer() {
        resetClickCount = 0;
        document.getElementById("resetBtn").textContent = "Reset";
        if (isRunning) {
          clearInterval(timerInterval);
          isRunning = false;
          document.body.classList.remove("timer-running");
          document.body.classList.remove("crunch-time");
          startBtn.textContent = "Resume";
          dynamicIsland.classList.remove("active");
        } else {
          isRunning = true;
          document.body.classList.add("timer-running");
          const container = document.querySelector(".container");
          container.classList.add("ignition");
          setTimeout(() => container.classList.remove("ignition"), 500);
          
          startBtn.textContent = "Pause";
          dynamicIsland.classList.add("active");

          timerInterval = setInterval(() => {
            remainingSeconds--;
            updateDisplay();

            // Crunch Time (Adrenaline Rush)
            if (remainingSeconds <= 60 && remainingSeconds > 0 && !isBreakMode) {
               document.body.classList.add("crunch-time");
            } else {
               document.body.classList.remove("crunch-time");
            }

            if (remainingSeconds <= 0) {
              clearInterval(timerInterval);
              isRunning = false;
              document.body.classList.remove("timer-running");
              document.body.classList.remove("crunch-time");
              startBtn.textContent = "Start";
              dynamicIsland.classList.remove("active");

              const duration = Math.floor(totalSeconds / 60);

              if (!isBreakMode) {
                sessionCount++;
                totalMinutes += duration;
                streakCount++;
                if (streakCount > maxStreak) maxStreak = streakCount;

                sessionHistory.push({
                  timestamp: new Date(),
                  duration: duration,
                  type: "focus",
                });

                updateStatsDisplay();
                saveStatsToLocal();
                showXP(); // V4.0 Micro-reward
                showToast(
                  "success",
                  "🎉 Session completed!",
                  `+${duration} mins tracked! Streak: ${streakCount} 🔥`,
                );
              } else {
                totalBreakMinutes += duration;
              }

              if (notificationEnabled) {
                playNotification();
                showNotification();
              }
              switchMode();
            }
          }, 1000);
        }
      }

      function resetTimer() {
        if (isRunning && resetClickCount === 0) {
           showToast("warning", "Dừng lại ư?", "Mọi nỗ lực sẽ đổ sông đổ biển! Bấm lần nữa để xác nhận bỏ cuộc.");
           const rBtn = document.getElementById("resetBtn");
           rBtn.textContent = "Sure?";
           resetClickCount++;
           setTimeout(() => { resetClickCount = 0; rBtn.textContent = "Reset"; }, 4000);
           return;
        }
        resetClickCount = 0;
        document.getElementById("resetBtn").textContent = "Reset";
        clearInterval(timerInterval);
        isRunning = false;
        document.body.classList.remove("timer-running");
        remainingSeconds = totalSeconds;
        updateDisplay();
        startBtn.textContent = "Start";
        dynamicIsland.classList.remove("active");
        changeCaption();
      }

      function switchMode() {
        isBreakMode = !isBreakMode;
        if (isBreakMode) {
          modeIndicator.textContent = "BREAK MODE";
          totalSeconds = 5 * 60;
          remainingSeconds = totalSeconds;
        } else {
          modeIndicator.textContent = "FOCUS MODE";
          totalSeconds = 25 * 60;
          remainingSeconds = totalSeconds;
        }
        updateDisplay();
        changeCaption();
      }

      function changeCaption() {
        const captions = isBreakMode ? breakCaptions : focusCaptions;
        const randomCaption =
          captions[Math.floor(Math.random() * captions.length)];
        captionText.style.animation = "none";
        setTimeout(() => {
          captionText.textContent = randomCaption;
          captionText.style.animation = "fadeIn 0.8s ease";
        }, 50);
      }

      // ========== AUDIO & NOTIFICATIONS ==========
      function playNotification() {
        const audioContext = new (
          window.AudioContext || window.webkitAudioContext
        )();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(
          400,
          audioContext.currentTime + 0.5,
        );
        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(
          0.01,
          audioContext.currentTime + 0.5,
        );
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.5);
      }

      function showNotification() {
        if ("Notification" in window && Notification.permission === "granted") {
          new Notification("Focus Timer", {
            body: isBreakMode
              ? "Time's up! Take a break. 🎉"
              : "Break is over! Let's get back to work. 💪",
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">⏱️</text></svg>',
          });
        }
      }

      // ========== FIREWORKS ANIMATION ==========
      function triggerFireworks() {
        var duration = 3 * 1000;
        var animationEnd = Date.now() + duration;
        var defaults = {
          startVelocity: 30,
          spread: 360,
          ticks: 60,
          zIndex: 100000,
        };

        function randomInRange(min, max) {
          return Math.random() * (max - min) + min;
        }

        var interval = setInterval(function () {
          var timeLeft = animationEnd - Date.now();
          if (timeLeft <= 0) {
            return clearInterval(interval);
          }
          var particleCount = 50 * (timeLeft / duration);

          confetti(
            Object.assign({}, defaults, {
              particleCount,
              origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 },
              colors: ["#FF2E93", "#FF8000", "#ffffff"],
            }),
          );
          confetti(
            Object.assign({}, defaults, {
              particleCount,
              origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 },
              colors: ["#FF2E93", "#FF8000", "#ffffff"],
            }),
          );
        }, 250);
      }

      // ========== REPORT VIEW DASHBOARD (XỊN XÒ) ==========
      function hideReport() {
        reportView.classList.remove("active");
        mainView.classList.remove("hidden");
      }

      function showReport() {
        if (sessionCount === 0) {
          showToast(
            "warning",
            "No data yet!",
            "Complete at least 1 focus session before viewing the report! 😎",
            4000,
          );
          return;
        }

        // Generate Report Content
        const totalOverallTime = totalMinutes + totalBreakMinutes;
        const focusPct =
          totalOverallTime === 0
            ? 100
            : Math.round((totalMinutes / totalOverallTime) * 100);
        const avgSession =
          sessionCount > 0 ? Math.round(totalMinutes / sessionCount) : 0;
        const prodScore = Math.min(100, Math.round((totalMinutes / 180) * 100)); // 180m = 100 score

        const chartGradientStart = "#FF2E93";
        const chartGradientEnd = "#FF8000";

        // Build Timeline Bars HTML
        const maxDuration = Math.max(
          ...sessionHistory.map((s) => s.duration),
          1,
        );
        let timelineHTML = "";
        const displayHistory = sessionHistory.slice(-6); // Max 6 for clean view

        displayHistory.forEach((session, idx) => {
          const widthPercent = (session.duration / maxDuration) * 100;
          const timeStr = session.timestamp.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
          });
          timelineHTML += `
                <div class="report-timeline-row">
                    <div class="report-timeline-time">${timeStr}</div>
                    <div class="report-timeline-bar-wrapper">
                        <!-- Delayed transition for smooth load effect -->
                        <div class="report-timeline-bar" style="width: 0%;" data-width="${widthPercent}%"></div>
                    </div>
                    <div class="report-timeline-mins">${session.duration}m</div>
                </div>
            `;
        });

        // ================= VẼ BIỂU ĐỒ SÓNG CỰC MƯỢT (WAVE CHART) =================
        const focusSessions = sessionHistory.filter((s) => s.type === "focus");
        // SVG relative viewBox for responsive scaling
        const chartW = 320;
        const chartH = 100;
        const stepX =
          focusSessions.length > 1
            ? chartW / (focusSessions.length - 1)
            : chartW;

          focusSessions.forEach((s, i) => {
            const x = i * stepX;
            const y = chartH - (s.duration / maxDuration) * chartH;
            pathD += `L ${x} ${y} `;

            <svg width="100%" height="100" viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none">
